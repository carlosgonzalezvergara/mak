            const [labelDropdown, setLabelDropdown] = useState(null); // { key, x, y }
            const labelDropdownRef = useRef(null);

            // Las líneas que empiezan con # abren un grupo. Todo lo demás se reparte por
            // comas y saltos de línea. Un archivo sin ningún # produce un solo grupo sin
            // título, así que los catálogos planos anteriores siguen leyéndose igual.
            const parseLabels = (text) => {
                const groups = [];
                let current = null;
                const push = (label) => {
                    if (!current) { current = { title: null, labels: [] }; groups.push(current); }
                    current.labels.push(label);
                };
                text.split(/\n/).forEach(line => {
                    const trimmed = line.trim();
                    if (!trimmed) return;
                    if (trimmed.startsWith('#')) {
                        const title = trimmed.replace(/^#+/, '').trim();
                        current = { title: title || null, labels: [] };
                        groups.push(current);
                        return;
                    }
                    trimmed.split(',').map(t => t.trim()).filter(Boolean).forEach(push);
                });
                return groups.filter(g => g.labels.length);
            };

            const serializeLabelGroups = (groups) => groups
                .filter(g => g.labels.length)
                .map(g => (g.title ? `# ${g.title}\n` : '') + g.labels.join(', '))
                .join('\n');

            const flattenLabelGroups = (groups) => groups.flatMap(g => g.labels);

            const openLabelsModal = () => {
                setLabelsTextDraft(serializeLabelGroups(labelGroups));
                setShowLabelsModal(true);
            };

            const confirmLabels = () => {
                applyLabels(parseLabels(labelsTextDraft));
                setShowLabelsModal(false);
            };

            // Aplica un catálogo y lo persiste. Se usa tanto desde el modal como al
            // importar el catálogo que venga dentro de un archivo .mak.
            // Añade al catálogo actual solo las etiquetas que faltan, conservando el grupo
            // del que vienen: si ya existe un grupo con ese título, se agregan ahí; si no,
            // se crea al final.
            const mergeLabelGroups = (currentGroups, incomingGroups) => {
                const have = new Set(flattenLabelGroups(currentGroups));
                const merged = currentGroups.map(g => ({ ...g, labels: [...g.labels] }));
                incomingGroups.forEach(g => {
                    const missing = g.labels.filter(l => !have.has(l));
                    if (!missing.length) return;
                    missing.forEach(l => have.add(l));
                    const target = merged.find(m => (m.title || null) === (g.title || null));
                    if (target) target.labels.push(...missing);
                    else merged.push({ title: g.title || null, labels: missing });
                });
                return merged;
            };

            const applyLabels = (groups) => {
                const clean = migrateLabelStore(groups);
                setLabelGroups(clean);
                try {
                    if (clean.length) localStorage.setItem('mak-labels', JSON.stringify(clean));
                    else localStorage.removeItem('mak-labels');
                } catch {}
            };

            const clearLabels = () => {
                applyLabels([]);
                setShowLabelsModal(false);
            };

            const handleLabelsFile = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    setLabelsTextDraft(prev => {
                        const existing = prev.trim();
                        const incoming = ev.target.result;
                        return existing ? existing + ', ' + incoming : incoming;
                    });
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            // Cerrar dropdown al hacer clic fuera
            useEffect(() => {
                if (!labelDropdown) return;
                const handler = (e) => {
                    if (labelDropdownRef.current && !labelDropdownRef.current.contains(e.target)) {
                        setLabelDropdown(null);
                    }
                };
                document.addEventListener('mousedown', handler);
                return () => document.removeEventListener('mousedown', handler);
            }, [labelDropdown]);

            // ===========================================
            // UTILIDADES
            // ===========================================
            const getFileName = (extension) => {
                const words = sentence.trim().split(/\s+/).slice(0, 5).join('_');
                const ext = extension === 'json' ? 'mak' : extension;
                return `${words}.${ext}`;
            };

            // Normaliza la expresión según el idioma elegido en el diálogo de New Diagram.
            // 'es' aplica solo las reglas del español, 'en' solo las del inglés y 'none'
            // deja el texto tal como se escribió. Antes se aplicaban ambos conjuntos a
            // toda expresión, lo que producía separaciones indebidas en el otro idioma.
            const normalizeSentence = (text, lang = 'es') => {
                const t = text.trim();
                if (lang === 'none') return t;
                if (lang === 'en') {
                    return t
                        // Normalizar comillas tipográficas
                        .replace(/['']/g, "'")
                        // Contracciones negativas irregulares (deben ir primero)
                        .replace(/\bwon't\b/gi, 'will not')
                        .replace(/\bcan't\b/gi, 'can not')
                        .replace(/\bshan't\b/gi, 'shall not')
                        .replace(/\bain't\b/gi, 'am not')
                        // Contracciones negativas regulares: don't, doesn't, didn't, isn't...
                        .replace(/n't\b/gi, ' not')
                        // Contracciones verbales no ambiguas
                        .replace(/\b(I|you|we|they|he|she|it|who|what|that|there|here)'ll\b/gi, '$1 will')
                        .replace(/\b(I|you|we|they|he|she|it|who|what|that|there|here)'ve\b/gi, '$1 have')
                        .replace(/\b(you|we|they|who|what|that|there|here)'re\b/gi, '$1 are')
                        .replace(/\bI'm\b/gi, 'I am')
                        .replace(/\blet's\b/gi, 'let us')
                        .replace(/\bwanna\b/gi, 'want to');
                        // 's y 'd son ambiguas y se resuelven de forma interactiva
                }
                return t
                    // Contracciones y pronombres fusionados del español
                    .replace(/\bdel\b/gi, 'de el')
                    .replace(/\bal\b/gi, 'a el')
                    .replace(/\bconmigo\b/gi, 'con migo')
                    .replace(/\bcontigo\b/gi, 'con tigo')
                    .replace(/\bconsigo\b/gi, 'con sigo');
            };

            const createEmptyTree = (text, lang = 'es') => ({
                id: 'root',
                text: normalizeSentence(text, lang),
                labels: [''],
                children: null,
                isNucleus: false,
                isConsolidated: false
            });

            // ===========================================
            // DETECCIÓN DE CLÍTICOS
            // ===========================================
            const CLITIC_LIST = ['nos', 'les', 'los', 'las', 'me', 'te', 'se', 'le', 'lo', 'la', 'os'];
            const SHORT_IMPERATIVE_STEMS = new Set([
                'di', 'da', 've', 'haz', 'pon', 'sal', 'ten', 'ven', 'id', 'sé', 'se', 'oíd', 'ved', 'oye', 'oid'
            ]);
            const CLITIC_EXCLUSIONS = new Set([
                'modelo', 'modelos', 'consuelo', 'consuelos', 'anzuelo', 'anzuelos',
                'pañuelo', 'pañuelos', 'abuelo', 'abuelos',
                'cielo', 'cielos', 'hielo', 'hielos', 'vuelo', 'vuelos',
                'suelo', 'suelos', 'duelo', 'duelos', 'pelo', 'pelos',
                'aquellos', 'aquellas', 'ellos', 'ellas',
                'estilo', 'estilos', 'siglo', 'siglos', 'título', 'títulos',
                'ejemplo', 'ejemplos', 'ángeles', 'tales',
            ]);

            const stripAccents = (str) => str.normalize('NFD').replace(/[\u0300-\u036f]/g, '');

            const extractClitics = (word) => {
                let remaining = word.toLowerCase();
                const clitics = [];
                const MAX_CLITICS = 3;

                for (let i = 0; i < MAX_CLITICS; i++) {
                    let matched = false;
                    for (const cl of CLITIC_LIST) {
                        if (remaining.endsWith(cl) && remaining.length > cl.length) {
                            clitics.unshift(cl);
                            remaining = remaining.slice(0, -cl.length);
                            matched = true;
                            break;
                        }
                    }
                    if (!matched) break;
                }

                if (clitics.length > 0 && remaining.length >= 2) {
                    const originalStem = word.slice(0, remaining.length);
                    return { stem: remaining, clitics, suggestion: originalStem + ' ' + clitics.join(' ') };
                }
                return null;
            };

            const detectCliticCandidates = (text) => {
                const words = text.trim().split(/\s+/);
                const candidates = [];
                const PUNCT_RE = /^([¡¿"'«(]*)(.+?)([!?.,;:…"'»)"']*)$/;

                for (let i = 0; i < words.length; i++) {
                    const word = words[i];
                    const match = word.match(PUNCT_RE);
                    if (!match) continue;
                    const [, puncBefore, core, puncAfter] = match;

                    if (CLITIC_EXCLUSIONS.has(core.toLowerCase())) continue;

                    const result = extractClitics(core);
                    if (!result) continue;

                    const stem = result.stem;
                    const stemClean = stripAccents(stem);

                    const shouldFlag =
                        stemClean.endsWith('r') ||
                        stemClean.endsWith('ndo') ||
                        stemClean.endsWith('d') ||
                        /[áéíóú]/.test(core) ||
                        SHORT_IMPERATIVE_STEMS.has(stemClean);

                    if (shouldFlag) {
                        const suggestion = puncBefore + result.suggestion + puncAfter;
                        candidates.push({
                            index: i,
                            original: word,
                            suggestion,
                            checked: true
                        });
                    }
                }

                return candidates;
            };

            const applyCliticSeparations = (text, candidates) => {
                const words = text.trim().split(/\s+/);
                const checkedByIndex = {};
                candidates.forEach(c => {
                    if (c.checked) {
                        const separated = c.suggestion.trim().split(/\s+/);
                        checkedByIndex[c.index] = separated;
                    }
                });
                const result = [];
                for (let i = 0; i < words.length; i++) {
                    if (checkedByIndex[i]) {
                        result.push(...checkedByIndex[i]);
                    } else {
                        result.push(words[i]);
                    }
                }
                return result.join(' ');
            };

            // ===========================================
            // ENGLISH CONTRACTION DISAMBIGUATION ('s / 'd)
            // ===========================================
            const CONTRACTION_PUNCT_RE = /^([("'¿¡]*)(.+?)([!?.,;:…"')"']*)$/;

            const detectAmbiguousContractions = (text) => {
                const normalized = text.replace(/['']/g, "'");
                const words = normalized.trim().split(/\s+/);
                const candidates = [];

                for (let i = 0; i < words.length; i++) {
                    const word = words[i];
                    const match = word.match(CONTRACTION_PUNCT_RE);
                    if (!match) continue;
                    const [, puncBefore, core, puncAfter] = match;
                    const lower = core.toLowerCase();

                    // Skip let's (handled automatically by normalizeSentence)
                    if (lower === "let's") continue;

                    if (/'s$/i.test(core)) {
                        const base = core.slice(0, -2);
                        candidates.push({
                            index: i,
                            original: word,
                            core,
                            base,
                            puncBefore,
                            puncAfter,
                            type: 's',
                            expansion: 'is',
                            options: [
                                { value: 'is', label: `${base} is` },
                                { value: 'has', label: `${base} has` },
                                { value: 'possessive', label: `${core} (possessive — no change)` }
                            ]
                        });
                    } else if (/'d$/i.test(core)) {
                        const base = core.slice(0, -2);
                        candidates.push({
                            index: i,
                            original: word,
                            core,
                            base,
                            puncBefore,
                            puncAfter,
                            type: 'd',
                            expansion: 'would',
                            options: [
                                { value: 'would', label: `${base} would` },
                                { value: 'had', label: `${base} had` }
                            ]
                        });
                    }
                }

                return candidates;
            };

            const applyContractionExpansions = (text, candidates) => {
                const normalized = text.replace(/['']/g, "'");
                const words = normalized.trim().split(/\s+/);
                const sorted = [...candidates].sort((a, b) => b.index - a.index);
                for (const c of sorted) {
                    if (c.expansion === 'possessive') {
                        words[c.index] = c.puncBefore + c.core + c.puncAfter;
                    } else {
                        const expanded = c.base + ' ' + c.expansion;
                        words[c.index] = c.puncBefore + expanded + c.puncAfter;
                    }
                }
                return words.join(' ');
            };

            const makeNewNode = (text = '') => ({
                id: `added-${Date.now()}-${Math.random().toString(16).slice(2)}`,
                text,
                labels: ['', ''],
                children: null,
                isNucleus: false,
                isInserted: true,
                isConsolidated: false
            });

            const updateNode = (node, id, updates) => {
                if (node.id === id) return { ...node, ...updates };
                if (node.children) {
                    return { ...node, children: node.children.map(c => updateNode(c, id, updates)) };
                }
                return node;
            };

            const findNodeById = (n, id) => {
                if (!n) return null;
                if (n.id === id) return n;
                if (n.children) {
                    for (const c of n.children) {
                        const r = findNodeById(c, id);
                        if (r) return r;
                    }
                }
                return null;
            };

            const shorten = (s, n = 18) => {
                const t = (s || '').trim();
                if (!t) return '∅';
                return t.length > n ? t.slice(0, n - 1) + '…' : t;
            };

            const buildPosLabel = (i, siblings) => {
                const n = siblings.length;
                if (n === 0) return 'Only position';
                if (i === 1) return 'At the beginning';
                if (i === n + 1) return 'At the end';
                const left = shorten(siblings[i - 2]);
                const right = shorten(siblings[i - 1]);
                return `Between "${left}" and "${right}"`;
            };

            // ===========================================
            // FORMATO DE TEXTO EN ETIQUETAS
            // ===========================================
            const formatLabelText = (text) => {
                if (!text) return null;
                const parts = [];
                let remaining = text;
                let key = 0;
                const patterns = [
                    { regex: /\*\*([^*]+)\*\*/, style: { fontWeight: 'bold' } },
                    { regex: /\*([^*]+)\*/, style: { fontStyle: 'italic' } },
                    { regex: /__([^_]+)__/, style: { fontSize: '0.75em', verticalAlign: 'super' } },
                    { regex: /_([^_]+)_/, style: { fontSize: '0.75em', verticalAlign: 'sub' } },
                    { regex: /%([^%]+)%/, style: { fontVariant: 'small-caps', textTransform: 'lowercase' } },
                    { regex: /~([^~]+)~/, style: { textDecoration: 'underline' } }
                ];
                while (remaining.length > 0) {
                    let earliestMatch = null;
                    let earliestIndex = remaining.length;
                    let matchedPattern = null;
                    for (const pattern of patterns) {
                        const match = remaining.match(pattern.regex);
                        if (match && match.index < earliestIndex) {
                            earliestMatch = match;
                            earliestIndex = match.index;
                            matchedPattern = pattern;
                        }
                    }
                    if (earliestMatch && matchedPattern) {
                        if (earliestIndex > 0) parts.push(<span key={key++}>{remaining.substring(0, earliestIndex)}</span>);
                        parts.push(<span key={key++} style={matchedPattern.style}>{earliestMatch[1]}</span>);
                        remaining = remaining.substring(earliestIndex + earliestMatch[0].length);
                    } else {
                        parts.push(<span key={key++}>{remaining}</span>);
                        break;
                    }
                }
                return parts.length > 0 ? parts : text;
            };

            const applyFormatToSpan = (span, text) => {
                if (!text) { span.textContent = ''; return; }
                span.innerHTML = '';
                let remaining = text;
                const patterns = [
                    { regex: /\*\*([^*]+)\*\*/, tag: 'strong', style: '' },
                    { regex: /\*([^*]+)\*/, tag: 'em', style: '' },
                    { regex: /__([^_]+)__/, tag: 'sup', style: 'font-size: 0.75em;' },
                    { regex: /_([^_]+)_/, tag: 'sub', style: 'font-size: 0.75em;' },
                    { regex: /%([^%]+)%/, tag: 'span', style: 'font-variant: small-caps; text-transform: lowercase;' },
                    { regex: /~([^~]+)~/, tag: 'u', style: '' }
                ];
                while (remaining.length > 0) {
                    let earliestMatch = null;
                    let earliestIndex = remaining.length;
                    let matchedPattern = null;
                    for (const pattern of patterns) {
                        const match = remaining.match(pattern.regex);
                        if (match && match.index < earliestIndex) {
                            earliestMatch = match;
                            earliestIndex = match.index;
                            matchedPattern = pattern;
                        }
                    }
                    if (earliestMatch && matchedPattern) {
                        if (earliestIndex > 0) span.appendChild(document.createTextNode(remaining.substring(0, earliestIndex)));
                        const el = document.createElement(matchedPattern.tag);
                        if (matchedPattern.style) el.style.cssText = matchedPattern.style;
                        el.textContent = earliestMatch[1];
                        span.appendChild(el);
                        remaining = remaining.substring(earliestIndex + earliestMatch[0].length);
                    } else {
                        span.appendChild(document.createTextNode(remaining));
                        break;
                    }
                }
            };

            // ===========================================
            // HISTORIAL UNDO/REDO
            // ===========================================
            useEffect(() => {
                if (tree && !isUndoRedo.current) {
                    setHistory(prev => {
                        const newHistory = prev.slice(0, historyIndex + 1);
                        newHistory.push(JSON.stringify(tree));
                        if (newHistory.length > 50) newHistory.shift();
                        return newHistory;
                    });
                    setHistoryIndex(prev => Math.min(prev + 1, 49));
                }
                isUndoRedo.current = false;
            }, [tree]);

            const canUndo = historyIndex > 0;
            const canRedo = historyIndex < history.length - 1;

            const handleUndo = useCallback(() => {
                if (canUndo) {
                    isUndoRedo.current = true;
                    setHistoryIndex(prev => prev - 1);
                    setTree(JSON.parse(history[historyIndex - 1]));
                }
            }, [canUndo, history, historyIndex]);

            const handleRedo = useCallback(() => {
                if (canRedo) {
                    isUndoRedo.current = true;
                    setHistoryIndex(prev => prev + 1);
                    setTree(JSON.parse(history[historyIndex + 1]));
                }
            }, [canRedo, history, historyIndex]);

            // ===========================================
            // GUARDAR
            // ===========================================
            const AUTOSAVE_KEY = 'mak-autosave';
            const AUTOSAVE_VERSION = '1.1';

            const autoSaveDebounced = useRef(null);
            if (!autoSaveDebounced.current) {
                autoSaveDebounced.current = debounce((saveFn) => saveFn(), 3000);
            }

            const buildAutoSaveData = useCallback(() => ({
                sentence,
                tree,
                divisionMode,
                selectedCuts,
                timestamp: new Date().toISOString(),
                version: AUTOSAVE_VERSION
            }), [sentence, tree, divisionMode, selectedCuts]);

            const writeAutoSave = useCallback(({ silent = false } = {}) => {
                if (!tree) return false;
                const data = buildAutoSaveData();
                try {
                    if (!silent) setIsSaving(true);
                    localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(data));
                    setLastSaved(new Date(data.timestamp));
                    if (!silent) setTimeout(() => setIsSaving(false), 500);
                    return true;
                } catch (err) {
                    console.error('Error auto-saving:', err);
                    setIsSaving(false);
                    return false;
                }
            }, [tree, buildAutoSaveData]);

            const clearAutoSave = useCallback(() => {
                autoSaveDebounced.current?.cancel?.();
                localStorage.removeItem(AUTOSAVE_KEY);
                setLastSaved(null);
                setIsSaving(false);
            }, []);

            const handleSaveJSON = useCallback(async () => {
                if (!tree) return;

                // Calcular el nombre por defecto sin extensión: getFileName('json')
                // devuelve "palabras.mak"; quitamos el sufijo ".mak" para que el modal
                // muestre solo el nombre y añada la extensión visualmente como tag.
                // Si la oración está vacía, fallback a 'mak_tree' para que el modal
                // no salga con el input en blanco y el botón Save deshabilitado.
                const fullName = getFileName('json');
                const defaultName = fullName.replace(/\.mak$/i, '') || 'mak_tree';

                const raw = await askForFilename({
                    title: 'Save Project',
                    defaultName,
                    extension: 'mak',
                    icon: 'save',
                });
                if (raw === null) return; // cancelado
                const filename = (raw || 'mak_tree').replace(/\s+/g, '_');

                // Flush any pending autosave and write the current state.
                // The backup is NOT cleared: this avoids losing the restoration
                // point if the user closes the tab right after saving manually.
                autoSaveDebounced.current?.flush?.();
                writeAutoSave({ silent: true });

                // El catálogo viaja dentro del archivo para que un ejercicio se pueda
                // compartir completo. Los .mak antiguos, sin esta clave, siguen abriendo.
                // Si el catálogo no tiene grupos con título, se guarda como lista plana
                // para que el archivo siga abriéndose en versiones anteriores de MAK.
                const payload = { sentence, tree };
                if (userLabels.length) payload.labels = hasLabelGroupTitles ? labelGroups : userLabels;
                const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `${filename}.mak`;
                a.click();
                URL.revokeObjectURL(a.href);
            }, [tree, sentence, userLabels, labelGroups, hasLabelGroupTitles, writeAutoSave, askForFilename]);

            // ===========================================
            // AUTO-GUARDADO
            // ===========================================
            const performAutoSave = useCallback(() => {
                // Autosave should reflect the user's visible state, even after undo/redo.
                writeAutoSave();
            }, [writeAutoSave]);

            useEffect(() => {
                if (tree) {
                    autoSaveDebounced.current(performAutoSave);
                }
            }, [sentence, tree, divisionMode, selectedCuts, performAutoSave]);

            // Emergency save before closing, reloading, or hiding the tab.
            useEffect(() => {
                const saveImmediately = () => {
                    if (!tree) return;
                    autoSaveDebounced.current?.cancel?.();
                    writeAutoSave({ silent: true });
                };
                const handleVisibilityChange = () => {
                    if (document.visibilityState === 'hidden') saveImmediately();
                };
                window.addEventListener('beforeunload', saveImmediately);
                document.addEventListener('visibilitychange', handleVisibilityChange);
                return () => {
                    window.removeEventListener('beforeunload', saveImmediately);
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                };
            }, [tree, writeAutoSave]);

            // Restore on mount.
            // En lugar del confirm() bloqueante, parseamos el localStorage y, si
            // hay datos válidos, abrimos el RestoreModal. La decisión real
            // (acceptRestore / declineRestore) ocurre cuando el usuario responde.
            useEffect(() => {
                const saved = localStorage.getItem(AUTOSAVE_KEY);
                if (!saved) return;
                try {
                    const data = JSON.parse(saved);
                    if (!data || !data.tree) {
                        clearAutoSave();
                        return;
                    }
                    const savedDate = new Date(data.timestamp);
                    const hasValidDate = !Number.isNaN(savedDate.getTime());
                    const minutesAgo = hasValidDate
                        ? Math.max(0, Math.round((Date.now() - savedDate.getTime()) / 60000))
                        : null;
                    setRestorePending({ data, savedDate, hasValidDate, minutesAgo });
                } catch (err) {
                    console.error('Error restoring auto-save:', err);
                    clearAutoSave();
                }
            }, [clearAutoSave]);

            // Handlers de la decisión del RestoreModal.
            const acceptRestore = useCallback(() => {
                if (!restorePending) return;
                const { data, savedDate, hasValidDate } = restorePending;
                isUndoRedo.current = true;
                setSentence(data.sentence || '');
                setTree(data.tree || null);
                setDivisionMode(data.divisionMode ?? null);
                setSelectedCuts(Array.isArray(data.selectedCuts) ? data.selectedCuts : []);
                // The restored state becomes the first history point.
                setHistory(data.tree ? [JSON.stringify(data.tree)] : []);
                setHistoryIndex(data.tree ? 0 : -1);
                if (hasValidDate) setLastSaved(savedDate);
                setRestorePending(null);
                setTimeout(() => { isUndoRedo.current = false; }, 0);
            }, [restorePending]);

            const declineRestore = useCallback(() => {
                clearAutoSave();
                setRestorePending(null);
            }, [clearAutoSave]);

            // ===========================================
            // ATAJOS DE TECLADO
            // ===========================================
            useEffect(() => {
                const handleKeyDown = (e) => {
                    const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
                    const modifier = isMac ? e.metaKey : e.ctrlKey;
                    const key = e.key.toLowerCase();
                    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
                        if (modifier && key === 's') { e.preventDefault(); handleSaveJSON(); }
                        return;
                    }
                    if (modifier && key === 'z' && !e.shiftKey) { e.preventDefault(); handleUndo(); }
                    else if (modifier && key === 'z' && e.shiftKey) { e.preventDefault(); handleRedo(); }
                    else if (modifier && key === 'y') { e.preventDefault(); handleRedo(); }
                    else if (modifier && key === 's') { e.preventDefault(); handleSaveJSON(); }
                    else if (modifier && (key === '+' || key === '=')) { e.preventDefault(); zoomIn(); }
                    else if (modifier && key === '-') { e.preventDefault(); zoomOut(); }
                    else if (modifier && key === '0') { e.preventDefault(); zoomReset(); }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [handleUndo, handleRedo, handleSaveJSON, zoomIn, zoomOut, zoomReset]);

            // ===========================================
            // ACCIONES PRINCIPALES
            // ===========================================
            const startAnalysis = (overrideSentence, lang) => {
                const text = overrideSentence !== undefined ? overrideSentence : sentence;
                if (text.trim()) {
                    if (overrideSentence !== undefined) setSentence(overrideSentence);
                    const newTree = createEmptyTree(text, lang || analysisLang || 'none');
                    setTree(newTree);
                    setDivisionMode(null);
                    setSelectedCuts([]);
                    setHistory([JSON.stringify(newTree)]);
                    setHistoryIndex(0);
                }
            };

            const handleStartAnalysis = () => {
                if (!sentence.trim()) return;
                startAnalysis();
            };

            const handleDivide = () => {
                const node = findNodeById(tree, divisionMode);
                const words = node.text.split(/\s+/);
                const segments = [];
                let start = 0;
                const sortedCuts = [...selectedCuts].sort((a, b) => a - b);
                [...sortedCuts, words.length - 1].forEach(cut => {
                    segments.push(words.slice(start, cut + 1).join(' '));
                    start = cut + 1;
                });
                const children = segments.filter(s => s.trim()).map((s, i) => ({
                    id: `${divisionMode}-${i}-${Date.now()}`,
                    text: s,
                    labels: ['', ''],
                    children: null,
                    isNucleus: false,
                    isConsolidated: false
                }));
                setTree(prev => updateNode(prev, divisionMode, { children }));
                setDivisionMode(null);
                setSelectedCuts([]);
            };

            const toggleConsolidated = (nodeId) => {
                setTree(prev => {
                    const node = findNodeById(prev, nodeId);
                    return updateNode(prev, nodeId, { isConsolidated: !node.isConsolidated });
                });
            };

            const expandNode = (nodeId) => {
                setTree(prev => {
                    const node = findNodeById(prev, nodeId);
                    if (!node || node.children) return prev;
                    const childNode = {
                        id: `${nodeId}-child-${Date.now()}`,
                        text: node.text,
                        labels: ['', ''],
                        children: null,
                        isNucleus: node.isNucleus,
                        isConsolidated: false
                    };
                    return updateNode(prev, nodeId, { children: [childNode], isNucleus: false });
                });
            };

            // ===========================================
            // BORRADO DE RAMAS
            // ===========================================
            // Elimina un hijo concreto conservando a sus hermanos y las etiquetas que
            // estos ya tengan anotadas. Si era el último hijo, el padre vuelve al estado
            // sin dividir, que es lo mismo que hace el botón de deshacer división.
            const removeBranch = (parentId, childId) => {
                setTree(prev => {
                    const parent = findNodeById(prev, parentId);
                    if (!parent || !parent.children) return prev;
                    const remaining = parent.children.filter(c => c.id !== childId);
                    return updateNode(prev, parentId, { children: remaining.length ? remaining : null });
                });
            };

            // Cuenta lo que se perdería al borrar una rama, para avisar solo cuando hay
            // trabajo hecho dentro de ella.
            const describeBranch = (node) => {
                let nodes = 0;
                let labels = 0;
                const walk = (n) => {
                    nodes += 1;
                    labels += (n.labels || []).filter(l => l && l.trim()).length;
                    if (n.children) n.children.forEach(walk);
                };
                walk(node);
                return { nodes, labels };
            };

            const requestRemoveBranch = (parentId, node) => {
                const info = describeBranch(node);
                if (info.nodes === 1 && info.labels === 0) {
                    removeBranch(parentId, node.id);
                } else {
                    setDeletePending({ parentId, childId: node.id, text: node.text, ...info });
                }
            };

            const addChildNode = (parentId) => {
                setNodeTextValue(''); // Limpiamos el texto previo
                setNodeTextPending({ parentId }); // Activamos el primer modal
            };

            const handleNodeTextConfirm = () => {
                if (!nodeTextPending) return;
    
                // Si el usuario no escribe nada y da a Next, podríamos cancelarlo o permitir un nodo vacío (aquí permitimos vacío o usamos '∅')
                const txt = nodeTextValue.trim(); 
    
                const parentId = nodeTextPending.parentId;
                const parent = findNodeById(tree, parentId);
                const existing = parent?.children ? [...parent.children] : [];
                const siblings = existing.map(c => (c.text || '').trim() || '∅');

                setNodeTextPending(null); // Oculta este modal
                setPosPicker({ parentId, txt: txt, siblings, pos: 1 }); // Muestra tu modal original de posición
            };

            const confirmInsertAtPosition = () => {
                if (!posPicker) return;
                const { parentId, txt, pos } = posPicker;
                setTree(prev => {
                    const parent = findNodeById(prev, parentId);
                    const existing = parent?.children ? [...parent.children] : [];
                    let p = Math.max(1, Math.min(existing.length + 1, parseInt(pos, 10) || existing.length + 1));
                    const newNode = makeNewNode(txt);
                    existing.splice(p - 1, 0, newNode);
                    return updateNode(prev, parentId, { children: existing });
                });
                setPosPicker(null);
            };

            // ===========================================
            // LABEL MANAGEMENT (multi-row)
            // ===========================================
            const addLabelRow = (nodeId) => {
                setTree(prev => {
                    const node = findNodeById(prev, nodeId);
                    if (!node || node.labels.length >= 5) return prev;
                    return updateNode(prev, nodeId, { labels: [...node.labels, ''] });
                });
            };

            const removeLabelRow = (nodeId, labelIndex) => {
                setTree(prev => {
                    const node = findNodeById(prev, nodeId);
                    if (!node || node.labels.length <= 1) return prev;
                    const newLabels = node.labels.filter((_, i) => i !== labelIndex);
                    return updateNode(prev, nodeId, { labels: newLabels });
                });
            };

            const updateLabel = (nodeId, labelIndex, value) => {
                setTree(prev => {
                    const node = findNodeById(prev, nodeId);
                    if (!node) return prev;
                    const newLabels = [...node.labels];
                    newLabels[labelIndex] = value;
                    return updateNode(prev, nodeId, { labels: newLabels });
                });
            };

            // ===========================================
            // CARGAR ARCHIVOS
            // ===========================================
            const handleLoadJSON = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const imported = JSON.parse(e.target.result);
                        if (!imported.tree || !imported.sentence) {
                            alert('Error: The file does not have the expected format.');
                            return;
                        }
                        // Migrar formato ENT si es necesario
                        const migrateNode = (node) => {
                            if (!node) return node;
                            const migrated = { ...node };
                            if (!migrated.labels) {
                                migrated.labels = [migrated.labelTop || ''];
                                delete migrated.labelTop;
                                delete migrated.labelBottom;
                            }
                            if (migrated.children) migrated.children = migrated.children.map(migrateNode);
                            return migrated;
                        };
                        const migratedTree = migrateNode(imported.tree);
                        setSentence(imported.sentence || '');
                        setTree(migratedTree);
                        setHistory([JSON.stringify(migratedTree)]);
                        setHistoryIndex(0);
                        clearAutoSave();

                        // Catálogo incluido en el archivo. Solo preguntamos cuando hay algo
                        // que se pueda perder: si el usuario no tiene catálogo, o si el
                        // entrante ya está contenido en el suyo, no hace falta molestarlo.
                        // El campo labels puede ser una lista plana (archivos anteriores)
                        // o una lista de grupos. migrateLabelStore normaliza ambas formas.
                        const incomingGroups = migrateLabelStore(imported.labels);
                        const incomingFlat = flattenLabelGroups(incomingGroups);
                        if (incomingFlat.length) {
                            const currentGroups = labelGroupsRef.current;
                            const currentFlat = flattenLabelGroups(currentGroups);
                            const missing = incomingFlat.filter(l => !currentFlat.includes(l));
                            if (!currentFlat.length) {
                                applyLabels(incomingGroups);
                            } else if (missing.length) {
                                setLabelImport({ incomingGroups, incomingFlat, missing, currentGroups, currentFlat });
                            }
                        }
                    } catch (error) {
                        alert('Error reading file.\n\nDetail: ' + error.message);
                    }
                };
                reader.readAsText(file);
                event.target.value = '';
            };

            // ===========================================
            // EXPORTACIÓN PNG
            // ===========================================
            const handleExport = async () => {
                const treeWrapper = document.querySelector('.tree-container .tree-wrapper');
                if (!treeWrapper) return;
                const treeContainer = document.querySelector('.tree-container');

                // Pedir nombre + fondo antes de iniciar el costoso proceso de renderizado.
                const fullName = getFileName('png');
                const defaultName = fullName.replace(/\.png$/i, '') || 'mak_tree';
                const result = await askForFilename({
                    title: 'Download as Image',
                    defaultName,
                    extension: 'png',
                    icon: 'image',
                    extraFields: [{
                        id: 'background',
                        label: 'Background',
                        default: 'white',
                        options: [
                            { value: 'white', label: 'White' },
                            { value: 'transparent', label: 'Transparent' },
                        ],
                    }],
                });
                if (result === null) return; // cancelado
                const filename = (result.name || 'mak_tree').replace(/\s+/g, '_');
                const backgroundMode = result.extras.background; // 'white' | 'transparent'

                const savedZoom = zoomLevel;
                setZoomLevel(100);
                await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
                await new Promise(resolve => setTimeout(resolve, 50));

                try {
                    const originalOverflow = treeContainer.style.overflow;
                    const originalWidth = treeContainer.style.width;
                    const originalMaxWidth = treeContainer.style.maxWidth;
                    treeContainer.style.overflow = 'visible';
                    treeContainer.style.width = 'fit-content';
                    treeContainer.style.maxWidth = 'none';

                    const undoBtns = treeWrapper.querySelectorAll('.btn-danger-soft');
                    const clearBtns = treeWrapper.querySelectorAll('.clear-text-btn');
                    const addBtns = treeWrapper.querySelectorAll('.add-node-btn');
                    const labelAddBtns = treeWrapper.querySelectorAll('.label-add-btn');
                    const labelRemoveBtns = treeWrapper.querySelectorAll('.label-remove-btn');
                    const editBtns = treeWrapper.querySelectorAll('.edit-text-btn');
                    const consolidateBtns = treeWrapper.querySelectorAll('.consolidate-btn');
                    const deleteBranchBtns = treeWrapper.querySelectorAll('.branch-delete-btn');

                    undoBtns.forEach(b => b.style.visibility = 'hidden');
                    clearBtns.forEach(b => b.style.display = 'none');
                    addBtns.forEach(b => b.style.display = 'none');
                    labelAddBtns.forEach(b => b.style.display = 'none');
                    labelRemoveBtns.forEach(b => b.style.display = 'none');
                    editBtns.forEach(b => b.style.display = 'none');
                    consolidateBtns.forEach(b => b.style.display = 'none');
                    deleteBranchBtns.forEach(b => b.style.display = 'none');

                    const connectors = treeWrapper.querySelectorAll('.connector-v, .v-line-stem');
                    const nodeBoxes = treeWrapper.querySelectorAll('.node-box');
                    const inputData = [];

                    const originalInlineStyles = {
                        connectors: Array.from(connectors).map(el => ({ el, cssText: el.style.cssText })),
                        nodeBoxes: Array.from(nodeBoxes).map(el => ({ el, cssText: el.style.cssText })),
                        treeWrapperPos: treeWrapper.style.position
                    };

                    // Strip node boxes: transparent bg/border/shadow
                    nodeBoxes.forEach(box => {
                        box.style.background = 'transparent';
                        box.style.backgroundColor = 'transparent';
                        box.style.border = '1px solid transparent';
                        box.style.boxShadow = 'none';
                    });

                    const getLabelValue = (element) => {
                        if (!element) return '';
                        if (element.tagName === 'INPUT') return element.value.trim();
                        const rawValue = element.getAttribute('data-raw-value');
                        return rawValue !== null ? rawValue.trim() : element.textContent.trim();
                    };

                    const nodeContainers = treeWrapper.querySelectorAll('.node-container');
                    nodeContainers.forEach(container => {
                        const labelsStack = container.querySelector(':scope > .labels-stack');
                        if (!labelsStack) return;
                        
                        const labelRows = labelsStack.querySelectorAll(':scope > .label-row');
                        let anyLabelHasValue = false;

                        labelRows.forEach(row => {
                            const labelWraps = row.querySelectorAll('.label-wrap');
                            const elements = row.querySelectorAll('.label-input, .label-display');
                            const combinedVal = Array.from(elements).map(el => getLabelValue(el)).filter(v => v && v !== 'label').join(' ');

                            const span = document.createElement('span');
                            if (!combinedVal) {
                                span.style.display = 'none';
                                row.style.display = 'none';
                            } else {
                                anyLabelHasValue = true;
                                span.className = 'exp-label';
                                span.style.cssText = `display: inline-flex; align-items: center; justify-content: center; min-width: 94px; height: var(--row-h); text-align: center; font-size: calc(11px * var(--mak-text-scale, 1)); font-family: 'Source Sans 3', sans-serif; padding: 0 calc(4px * var(--mak-text-scale, 1)); border: 1px solid transparent; border-radius: 4px; background-color: transparent; color: var(--label-text); box-sizing: border-box;`;
                                applyFormatToSpan(span, combinedVal);
                            }

                            labelWraps.forEach(lw => lw.style.display = 'none');
                            inputData.push({ type: 'label', labelWraps, span, row, parent: row });
                            row.insertBefore(span, row.firstChild);
                        });

                        if (!anyLabelHasValue) {
                            labelsStack.dataset.wasHidden = 'true';
                            labelsStack.style.display = 'none';
                        }
                    });

                    const canvas = await html2canvas(treeWrapper, {
                        backgroundColor: backgroundMode === 'white' ? '#ffffff' : null,
                        scale: 2,
                        width: treeWrapper.scrollWidth,
                        height: treeWrapper.scrollHeight
                    });

                    const link = document.createElement('a');
                    link.download = `${filename}.png`;
                    link.href = canvas.toDataURL();
                    link.click();

                    treeContainer.style.overflow = originalOverflow;
                    treeContainer.style.width = originalWidth;
                    treeContainer.style.maxWidth = originalMaxWidth;

                    inputData.forEach(d => {
                        d.span.remove();
                        d.labelWraps.forEach(lw => lw.style.display = '');
                        if (d.row) d.row.style.display = '';
                    });

                    treeWrapper.querySelectorAll('.labels-stack[data-was-hidden]').forEach(stack => {
                        stack.style.display = '';
                        delete stack.dataset.wasHidden;
                    });

                    originalInlineStyles.connectors.forEach(({ el, cssText }) => { el.style.cssText = cssText; });
                    originalInlineStyles.nodeBoxes.forEach(({ el, cssText }) => { el.style.cssText = cssText; });

                    undoBtns.forEach(b => b.style.visibility = 'visible');
                    clearBtns.forEach(b => b.style.display = '');
                    addBtns.forEach(b => b.style.display = '');
                    labelAddBtns.forEach(b => b.style.display = '');
                    labelRemoveBtns.forEach(b => b.style.display = '');
                    editBtns.forEach(b => b.style.display = '');
                    consolidateBtns.forEach(b => b.style.display = '');
                    deleteBranchBtns.forEach(b => b.style.display = '');

                } finally {
                    setZoomLevel(savedZoom);
                }
            };

            // ===========================================
            // RENDERIZADO DE ETIQUETAS (MULTI-FILA)
            // ===========================================
            const renderSingleLabel = (node, labelIndex) => {
                const value = node.labels[labelIndex] || '';
                const hasValue = value.trim() !== '';
                const labelKey = `${node.id}-label-${labelIndex}`;
                const isEditing = editingLabel === labelKey;
                const baseClass = `label-input ${hasValue ? 'has-value' : ''}`;

                const setValue = (newVal) => updateLabel(node.id, labelIndex, newVal);
                const startEditing = () => setEditingLabel(labelKey);
                
                const handleBlur = () => {
                    setTimeout(() => {
                        setEditingLabel(prev => prev === labelKey ? null : prev);
                    }, 200);
                };

                // Nueva lógica para Enter, Tab y Shift+Tab
                const handleKeyDown = (e) => { 
                    if (e.key === 'Enter') { 
                        e.preventDefault(); 
                        setEditingLabel(null); 
                    } else if (e.key === 'Tab') {
                        e.preventDefault(); // Evita el comportamiento por defecto del navegador
                        
                        // 1. Aplanamos el árbol para conocer el orden lógico (de izquierda a derecha)
                        const flatNodes = [];
                        const flatten = (n) => {
                            if (!n) return;
                            flatNodes.push(n);
                            if (n.children) n.children.forEach(flatten);
                        };
                        flatten(tree);
                        
                        const currentNodeIdx = flatNodes.findIndex(n => n.id === node.id);
                        
                        if (e.shiftKey) {
                            // NAVEGACIÓN HACIA ATRÁS (Shift + Tab)
                            if (labelIndex > 0) {
                                // Subir a la etiqueta anterior del mismo nodo
                                setEditingLabel(`${node.id}-label-${labelIndex - 1}`);
                            } else if (currentNodeIdx > 0) {
                                // Ir a la última etiqueta del nodo anterior
                                const prevNode = flatNodes[currentNodeIdx - 1];
                                setEditingLabel(`${prevNode.id}-label-${prevNode.labels.length - 1}`);
                            }
                        } else {
                            // NAVEGACIÓN HACIA ADELANTE (Tab)
                            if (labelIndex + 1 < node.labels.length) {
                                // Bajar a la siguiente etiqueta del mismo nodo
                                setEditingLabel(`${node.id}-label-${labelIndex + 1}`);
                            } else if (currentNodeIdx + 1 < flatNodes.length) {
                                // Ir a la primera etiqueta del nodo siguiente a la derecha
                                const nextNode = flatNodes[currentNodeIdx + 1];
                                setEditingLabel(`${nextNode.id}-label-0`);
                            } else {
                                // Si es el último nodo y la última etiqueta, salimos de la edición
                                setEditingLabel(null);
                            }
                        }
                    }
                };

                const hasPills = userLabels.length > 0;
                // Se filtra dentro de cada grupo y se descartan los que quedan vacíos, de
                // modo que al escribir solo sobrevivan los encabezados con coincidencias.
                const filteredGroups = hasPills
                    ? labelGroups
                        .map(g => ({ ...g, labels: g.labels.filter(l => l.toLowerCase().includes(value.toLowerCase())) }))
                        .filter(g => g.labels.length)
                    : [];

                if (isEditing) {
                    return (
                        <div className="label-wrap" style={{ position: 'relative' }}>
                            <input 
                                type="text" 
                                value={value} 
                                ref={(el) => { if (el) activeLabelInputRef.current = el; }}
                                onChange={(e) => { setValue(e.target.value); }}
                                onBlur={handleBlur} 
                                onKeyDown={(e) => {
                                    if (e.key === 'Escape' && labelDropdown) {
                                        setLabelDropdown(null);
                                        e.stopPropagation();
                                        return;
                                    }
                                    handleKeyDown(e);
                                }}
                                onFocus={(e) => {
                                    if (hasPills) {
                                        const rect = e.target.getBoundingClientRect();
                                        setLabelDropdown({ key: labelKey, x: rect.left + rect.width / 2, y: rect.bottom + 6 });
                                    }
                                }}
                                autoFocus 
                                className={baseClass} 
                                style={{ width: '94px' }} 
                                placeholder="label" 
                            />
                            {labelDropdown && labelDropdown.key === labelKey && hasPills && filteredGroups.length > 0 && (
                                <div
                                    ref={labelDropdownRef}
                                    className="label-dropdown"
                                    style={{ top: labelDropdown.y, left: labelDropdown.x, transform: 'translateX(-50%)' }}
                                    onMouseDown={(e) => e.preventDefault()}
                                >
                                    <span className="label-dropdown-clear" onMouseDown={() => { setValue(''); setLabelDropdown(null); }}>clear label</span>
                                    {filteredGroups.map((g, gi) => (
                                        <div key={gi}>
                                            {g.title && <div className="label-dropdown-group">{g.title}</div>}
                                            <div className="label-dropdown-pills">
                                                {g.labels.map(lbl => (
                                                    <span key={lbl} className="label-pill" onMouseDown={() => { setValue(lbl); setLabelDropdown(null); setEditingLabel(null); }}>
                                                        {lbl}
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    );
                }

                const displayClass = `label-display ${hasValue ? 'has-value' : ''}`;
                return (
                    <div className="label-wrap" style={{ position: 'relative' }}>
                        <span 
                            className={displayClass} 
                            style={{ width: '94px', minWidth: '94px', maxWidth: '94px' }} 
                            onClick={(e) => {
                                startEditing();
                                if (hasPills) {
                                    const rect = e.currentTarget.getBoundingClientRect();
                                    setLabelDropdown({ key: labelKey, x: rect.left + rect.width / 2, y: rect.bottom + 6 });
                                }
                            }}
                            data-raw-value={value || ''}
                        >
                            <span className="node-text-ellipsis" title={hasValue ? value : ''}>
                                {hasValue ? formatLabelText(value) : <span style={{color: '#9ca3af'}}>label</span>}
                            </span>
                        </span>
                    </div>
                );
            };

            const renderLabelsStack = (node, parentId = null, showDelete = false) => {
                const labels = node.labels || [''];
                return (
                    <div className="labels-stack">
                        {/* La papelera va aquí, al inicio de la columna, porque es donde el
                            usuario percibe que empieza la rama. Está fuera de las filas de
                            etiqueta para no confundirse con la × que borra una fila. */}
                        {parentId && showDelete && (
                            <button
                                className="branch-delete-btn"
                                title="Delete this branch"
                                onMouseEnter={() => setHoverDeleteId(node.id)}
                                onMouseLeave={() => setHoverDeleteId(null)}
                                onClick={(e) => { e.stopPropagation(); setHoverDeleteId(null); requestRemoveBranch(parentId, node); }}
                            >
                                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                                    <path d="M3 6h18"></path>
                                    <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"></path>
                                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                                </svg>
                            </button>
                        )}
                        {labels.map((label, idx) => (
                            <React.Fragment key={idx}>
                                {idx > 0 && <div className="label-connector-v" />}
                                <div className="label-row">
                                    {renderSingleLabel(node, idx)}
                                    {labels.length > 1 && (
                                        <button className="label-remove-btn" onClick={(e) => { e.stopPropagation(); removeLabelRow(node.id, idx); }} title="Remove this label row">×</button>
                                    )}
                                </div>
                            </React.Fragment>
                        ))}
                        {labels.length < 5 && (
                            <button className="label-add-btn" onClick={(e) => { e.stopPropagation(); addLabelRow(node.id); }} title="Add label row">+</button>
                        )}
                    </div>
                );
            };

            // ===========================================
            // RENDERIZADO DE NODOS
            // ===========================================
            // ===========================================
            // RENDERIZADO DE NODOS
            // ===========================================
            const renderNode = (node, parentId = null) => {
                const isRoot = node.id === 'root';
                const isDiv = divisionMode === node.id;
                const hasC = node.children && node.children.length > 0;
                const isEmpty = !node.text || node.text.trim() === '';
                const words = node.text ? node.text.split(/\s+/) : [];
                const canDivide = words.length > 1 && !node.isInserted && !node.isConsolidated;
                const canConsolidate = words.length > 1 && !node.isInserted && !hasC;
                const isTerminal = !hasC;
                const isSingleWordTerminal = isTerminal && words.length === 1;
                const isWhiteTerminal = isTerminal && (words.length === 1 || node.isConsolidated);
                const isEditingText = editingNode === node.id;
                const isSplitPoint = isEmpty && hasC && !isRoot;
                // La opacidad se hereda, así que basta con marcar el nodo que se va a
                // borrar para que toda su descendencia se atenúe con él.
                const isDoomed = hoverDeleteId === node.id;

                if (isSplitPoint) {
                    return (
                        <div className={`node-container ${isDoomed ? 'branch-doomed' : ''}`} key={node.id}
                             onMouseOver={(e) => { e.stopPropagation(); setHoverNodeId(node.id); }}
                             onMouseOut={(e) => { e.stopPropagation(); setHoverNodeId(null); }}>
                            {renderLabelsStack(node, parentId, hoverNodeId === node.id)}
                            <div style={{display:'flex', flexDirection:'column', alignItems:'center', width:'100%'}}>
                                <div className="connector-v" style={{height:'calc(var(--row-h) / 2)'}} />
                                <div className="children-container">
                                    {node.children.map((c) => (
                                        <div className="child-branch" key={c.id}>
                                            <div className="v-line-stem" />
                                            {renderNode(c, node.id)}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    );
                }

                return (
                    <div className={`node-container ${isDoomed ? 'branch-doomed' : ''}`} key={node.id}
                         onMouseOver={(e) => { e.stopPropagation(); setHoverNodeId(node.id); }}
                         onMouseOut={(e) => { e.stopPropagation(); setHoverNodeId(null); }}>
                        {!isRoot && renderLabelsStack(node, parentId, hoverNodeId === node.id)}

                        {isEmpty ? (
                            isRoot ? null : <div className="connector-v" style={{ height: 'var(--row-h)' }} />
                        ) : (
                            <>
                                {!isRoot && <div className="connector-v" style={{ height: 'var(--row-h)' }} />}

                                {isDiv ? (
                                    <div style={{background:'#f8fafc', padding:'15px', border:'1px solid #374151', borderRadius:'4px'}}>
                                        <div style={{display:'flex', gap:'4px', marginBottom:'10px'}}>
                                            {words.map((w, i) => (
                                                <React.Fragment key={i}>
                                                    <span style={{padding:'6px 10px', background:'white', border:'1px solid #cbd5e1'}}>{w}</span>
                                                    {i < words.length - 1 && (
                                                        <button
                                                            onClick={() => setSelectedCuts(prev => prev.includes(i) ? prev.filter(x => x !== i) : [...prev, i].sort((a,b) => a-b))}
                                                            style={{width:'10px', background: selectedCuts.includes(i) ? '#000000' : '#e2e8f0', border:'none', cursor:'pointer'}}
                                                        />
                                                    )}
                                                </React.Fragment>
                                            ))}
                                        </div>
                                        <div style={{display:'flex', gap:'8px', justifyContent:'center'}}>
                                            <button onClick={handleDivide} className="btn btn-primary" style={{padding:'5px 12px'}}>Divide</button>
                                            <button onClick={() => setDivisionMode(null)} className="btn btn-outline" style={{padding:'5px 12px'}}>Cancel</button>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="node-box-row">
                                        <div className={`node-box ${isRoot ? 'root-node' : ''} ${isWhiteTerminal ? 'terminal-node' : ''} ${(canDivide && !isEditingText) ? 'can-divide' : ''}`} onClick={() => !hasC && canDivide && !isEditingText && setDivisionMode(node.id)}>
                                            {isEditingText ? (
                                                <input
                                                    type="text"
                                                    value={node.text}
                                                    onChange={(e) => setTree(prev => updateNode(prev, node.id, { text: e.target.value }))}
                                                    onBlur={() => setEditingNode(null)}
                                                    onKeyDown={(e) => { if (e.key === 'Enter') setEditingNode(null); }}
                                                    autoFocus
                                                    style={{
                                                        textAlign: 'center', border: '1px dashed var(--accent)', borderRadius: '4px',
                                                        padding: '2px 4px', fontFamily: 'inherit', fontStyle: 'italic', fontSize: 'calc(11px * var(--mak-text-scale, 1))', color: 'var(--ink)',
                                                        background: 'var(--cream)', outline: 'none', width: isRoot ? `${Math.max(node.text?.length || 1, 3)}ch` : 'calc(100% - 8px)', minWidth: isRoot ? '40px' : '0', maxWidth: isRoot ? 'none' : 'calc(100% - 8px)'
                                                    }}
                                                    onClick={(e) => e.stopPropagation()}
                                                />
                                            ) : (
                                                isRoot ? (
                                                    node.text
                                                ) : (
                                                    <span className="node-text-ellipsis" title={node.text}>{node.text}</span>
                                                )
                                            )}

                                            {canConsolidate && !isEditingText && (
                                                <button className="consolidate-btn" title={node.isConsolidated ? "Allow division" : "Consolidate"} onClick={(e) => { e.stopPropagation(); toggleConsolidated(node.id); }}>
                                                    {node.isConsolidated ? '÷' : '∪'}
                                                </button>
                                            )}
                                            {hasC && !node.isInserted && !isEditingText && (
                                                <button 
                                                    className="add-node-btn" 
                                                    title="Add child node" 
                                                    onClick={(e) => { e.stopPropagation(); addChildNode(node.id); }}
                                                >
                                                    +<span style={{ fontSize: '0.7em', marginLeft: '1px', transform: 'translateY(1px)' }}>1</span>
                                                </button>
                                            )}
                                            {!isEditingText && canDivide && (
                                                <button className="clear-text-btn" title="Clear text" onClick={(e) => { e.stopPropagation(); setTree(prev => updateNode(prev, node.id, { text: '' })); }}>✕</button>
                                            )}
                                            {!isEditingText && (
                                                <button className="edit-text-btn" title="Edit text" onClick={(e) => { e.stopPropagation(); setEditingNode(node.id); }}>✎</button>
                                            )}
                                        </div>
                                        {hasC && (
                                            <button className="btn-danger-soft node-revert-btn" onClick={(e) => { e.stopPropagation(); setTree(prev => updateNode(prev, node.id, { children: null })); }} title="Undo division">↩</button>
                                        )}
                                    </div>
                                )}

                            </>
                        )}

                        {/* Lower labels: root node only */}
                        {isRoot && (
                            <>
                                {!isEmpty && <div className="connector-v" style={{height:'var(--row-h)'}} />}
                                {renderLabelsStack(node)}
                            </>
                        )}

                        {hasC && (
                            <div style={{display:'flex', flexDirection:'column', alignItems:'center', width:'100%'}}>
                                <div className="connector-v" style={{height:'calc(var(--row-h) / 2)'}} />
                                <div className="children-container">
                                    {node.children.map((c) => (
                                        <div className="child-branch" key={c.id}>
                                            <div className="v-line-stem" />
                                            {renderNode(c, node.id)}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            // ===========================================
            // MAIN VIEW — PANEL + CANVAS LAYOUT
            // ===========================================
            const [guideOpen, setGuideOpen] = useState(false);
            const guideInnerRef = useRef(null);
            const [guideHeight, setGuideHeight] = useState(0);
            // Medimos el contenido cada vez que se abre, en vez de fijar un máximo en el
            // CSS: así la guía puede crecer sin que haya que recordar ajustar un número.
            useEffect(() => {
                if (guideOpen && guideInnerRef.current) {
                    setGuideHeight(guideInnerRef.current.scrollHeight);
                }
            }, [guideOpen]);
            const [showNewDiagram, setShowNewDiagram] = useState(false);
            const [newDiagramText, setNewDiagramText] = useState('');
            
            // Estados y referencias para el panel IPA
            const [showIPA, setShowIPA] = useState(false);
            const newDiagramInputRef = useRef(null);

            const insertIPAChar = (char) => {
                const input = newDiagramInputRef.current;
                if (!input) return;
                const start = input.selectionStart;
                const end = input.selectionEnd;
                const newVal = newDiagramText.substring(0, start) + char + newDiagramText.substring(end);
                setNewDiagramText(newVal);
                // Retornar el foco al input después de insertar el caracter
                setTimeout(() => {
                    input.focus();
                    const pos = start + char.length;
                    input.setSelectionRange(pos, pos);
                }, 0);
            };

            const handleNewDiagram = () => {
                setNewDiagramText('');
                setShowIPA(false);
                setCliticPending(null);
                setContractionPending(null);
                setShowNewDiagram(true);
            };

            // --- Helper: proceed after clitics are resolved (check for English contractions next) ---
            const proceedAfterClitics = (text) => {
                const contractions = analysisLang === 'en' ? detectAmbiguousContractions(text) : [];
                if (contractions.length > 0) {
                    setContractionPending({ text, candidates: contractions });
                } else {
                    finalizeAndStart(text);
                }
            };

            // --- Helper: finalize and start analysis ---
            const finalizeAndStart = (text) => {
                setSentence(text);
                setShowNewDiagram(false);
                setNewDiagramText('');
                setCliticPending(null);
                setContractionPending(null);
                startAnalysis(text);
            };

            const handleNewDiagramConfirm = () => {
                if (!newDiagramText.trim()) return;
                const text = newDiagramText.trim();
                // Paso 1: clíticos, solo en español
                const clitics = analysisLang === 'es' ? detectCliticCandidates(text) : [];
                if (clitics.length > 0) {
                    setCliticPending({ text, candidates: clitics });
                } else {
                    // No clitics — check English contractions
                    proceedAfterClitics(text);
                }
            };

            // --- Clitic modal handlers ---
            const handleCliticConfirm = () => {
                if (!cliticPending) return;
                const textAfterClitics = applyCliticSeparations(cliticPending.text, cliticPending.candidates);
                setCliticPending(null);
                proceedAfterClitics(textAfterClitics);
            };

            const handleCliticBack = () => {
                setCliticPending(null);
            };

            const toggleCliticCandidate = (idx) => {
                setCliticPending(prev => {
                    if (!prev) return prev;
                    const updated = prev.candidates.map((c, i) =>
                        i === idx ? { ...c, checked: !c.checked } : c
                    );
                    return { ...prev, candidates: updated };
                });
            };

            // --- Contraction modal handlers ---
            const handleContractionConfirm = () => {
                if (!contractionPending) return;
                const finalText = applyContractionExpansions(contractionPending.text, contractionPending.candidates);
                finalizeAndStart(finalText);
            };

            const handleContractionSkip = () => {
                if (!contractionPending) return;
                finalizeAndStart(contractionPending.text);
            };

            const handleContractionBack = () => {
                setContractionPending(null);
                // Go back: if there were clitics originally, re-show them? 
                // Simpler: just go back to input step
            };

            const updateContractionExpansion = (idx, value) => {
