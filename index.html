<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.A.K. - Systemic Functional Linguistics Diagram Tool</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <link rel="icon" type="image/png" href="favicon.png".png">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap');

        :root {
            --parchment: #FAF6F1;
            --parchment-deep: #F3EDE4;
            --cream: #FFFFFF;
            --ink: #2C2420;
            --ink-light: #5C534D;
            --ink-muted: #8C837B;
            --rule: #D4C9BC;
            --rule-light: #E8E0D6;
            --accent: #8B3A3A;
            --accent-hover: #6E2D2D;
            --accent-soft: #F5EDED;
            --accent-border: #D4A3A3;
            --node-bg: #FFFEFA;
            --node-shadow: 0 2px 8px rgba(44,36,32,0.08), 0 1px 2px rgba(44,36,32,0.06);
            --node-shadow-hover: 0 4px 16px rgba(44,36,32,0.12), 0 2px 4px rgba(44,36,32,0.08);
            --label-bg: #F9F4EE;
            --label-bg-filled: #F0E8DF;
            --label-border: #D4C9BC;
            --label-border-filled: #B8A99A;
            --label-text: #4A3F37;
            --mak-text-scale: 1;
            --row-h: calc((11px * var(--mak-text-scale, 1)) + (4px * var(--mak-text-scale, 1) * 2) + 2px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Source Sans 3', 'Segoe UI', sans-serif;
            background-color: var(--parchment);
            min-height: 100vh;
            color: var(--ink);
        }

        /* ===========================================
           MAIN LAYOUT — PANEL + CANVAS SPLIT
           =========================================== */
        .app-layout {
            display: grid;
            grid-template-columns: 210px 1fr;
            min-height: 100vh;
        }

        /* ===========================================
           LEFT PANEL
           =========================================== */
        .side-panel {
            background: var(--parchment-deep);
            border-right: 1px solid var(--rule);
            padding: 18px 14px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
        }

        .panel-logo {
            font-family: 'DM Serif Display', serif;
            font-size: 1.4rem;
            letter-spacing: 0.1em;
            color: var(--ink);
            text-align: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--rule);
        }
        .panel-logo small {
            display: block;
            font-family: 'Source Sans 3', sans-serif;
            font-size: 0.45rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--ink-muted);
            margin-top: 3px;
            font-weight: 500;
        }

        .panel-section-title {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--ink-muted);
            font-weight: 600;
            margin-bottom: 5px;
        }

        .panel-input {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid var(--rule);
            border-radius: 6px;
            font-size: 13px;
            font-family: 'Source Sans 3', sans-serif;
            background: var(--cream);
            color: var(--ink);
            outline: none;
            transition: border-color 0.2s;
        }
        .panel-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(139,58,58,0.1);
        }
        .panel-input::placeholder {
            color: var(--ink-muted);
            font-style: italic;
        }

        .panel-btn-row {
            display: flex;
            gap: 6px;
        }

        .panel-btn {
            flex: 1;
            padding: 8px 0;
            border: 1px solid var(--rule);
            background: var(--cream);
            border-radius: 6px;
            font-size: 14px; /* Aumentado */
            font-family: 'Source Sans 3', sans-serif;
            font-weight: 600;
            color: var(--ink-light);
            cursor: pointer;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.15s;
        }
        .panel-btn:hover:not(.primary) {
            background: #ffffff;
            border-color: var(--accent-border);
            color: var(--accent);
            box-shadow: 0 4px 10px rgba(44, 36, 32, 0.06);
        }
        .panel-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .panel-btn.primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .panel-btn.primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 10px rgba(139, 58, 58, 0.25);
        }

        .panel-tools {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .panel-tool-btn {
            padding: 7px 10px;
            border: none;
            background: transparent;
            border-radius: 6px;
            font-size: 14px; /* Aumentado */
            font-family: 'Source Sans 3', sans-serif;
            color: var(--ink-light);
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.15s;
        }
        .panel-tool-btn:hover {
            background: rgba(139,58,58,0.06);
            color: var(--ink);
        }
        .panel-tool-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .panel-tool-btn:disabled:hover {
            background: transparent;
            color: var(--ink-light);
        }

        .panel-tool-icon {
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            color: currentColor;
        }

        .panel-spacer { flex: 1; }

        .panel-footer {
            padding-top: 12px;
            border-top: 1px solid var(--rule);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Autosave in panel */
        .panel-autosave-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: #7C9A6E; display: inline-block;
        }
        .panel-autosave-dot.saving {
            background: #C4963C;
            animation: pulse 1s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,100% { transform: scale(1); opacity: .7; }
            50% { transform: scale(1.35); opacity: 1; }
        }
        .autosave-ellipsis { display: inline-flex; margin-left: 1px; letter-spacing: 1px; }
        .autosave-ellipsis span {
            display: inline-block; width: 5px; text-align: center;
            opacity: 0.2; animation: ellipsis 1s infinite;
        }
        .autosave-ellipsis span:nth-child(2) { animation-delay: 0.15s; }
        .autosave-ellipsis span:nth-child(3) { animation-delay: 0.30s; }
        @keyframes ellipsis {
            0%,60%,100% { opacity: 0.2; }
            30% { opacity: 1; }
        }

        /* Quick guide in panel */
        .panel-guide-toggle {
            width: 100%;
            padding: 10px 12px; /* Un poco más alto para darle presencia */
            border: 1px solid var(--rule); /* Le damos un borde para que parezca un panel interactivo */
            background: var(--cream); /* Fondo blanco/crema para que resalte sobre el fondo del panel lateral */
            border-radius: 6px;
            font-size: 14px; 
            font-family: 'Source Sans 3', sans-serif;
            font-weight: 600; /* Texto en seminegrita */
            color: var(--ink); /* Color oscuro en lugar de gris apagado */
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            box-shadow: 0 1px 3px rgba(44,36,32,0.04); /* Una sombra levísima para darle volumen */
            position: relative;
            z-index: 2;
        }
        .panel-guide-toggle:hover {
            background: #ffffff;
            border-color: var(--accent-border); /* Guiño al color principal al pasar el ratón */
            color: var(--accent);
            box-shadow: 0 4px 10px rgba(44, 36, 32, 0.06);
        }
        .panel-guide-toggle .panel-tool-icon {
            color: var(--accent); /* Pone el icono de "info" en rojo corporativo */
        }
        /* Estilo especial cuando el panel de abajo está visible */
        .panel-guide-toggle.open-style {
            border-bottom: none; /* Quitamos el borde por completo, no solo el color */
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
            padding-bottom: 11px; /* Sumamos 1px al padding para compensar el borde perdido y que el texto no salte */
            box-shadow: none !important; /* Eliminamos la sombra para que no manche el panel inferior */
            z-index: 1; /* Ya no forzamos que se superponga */
        }
        .panel-guide-toggle.open-style:hover {
            border-color: var(--rule); 
        }
        .panel-guide-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
            background-color: transparent;
            border: 1px solid transparent;
            border-top: none; /* Como el de arriba no tiene borde abajo, encajan perfecto */
            border-radius: 0 0 6px 6px;
            margin-top: 0; /* Eliminamos el truco del margen negativo */
            box-shadow: none;
        }
        .panel-guide-content.open {
            /* La altura la fija el componente midiendo el contenido real, para que la
               guía no se corte al crecer. Aquí solo van los estilos visuales. */
            background-color: var(--cream);
            border-color: var(--rule);
            box-shadow: 0 4px 10px rgba(44, 36, 32, 0.06);
        }
        .panel-guide-inner {
            padding: 12px 12px 18px 12px;
            font-size: 12px;
            line-height: 1.6;
            color: var(--ink-light);
        }
        .panel-guide-inner strong { color: var(--ink); }
        .panel-guide-inner code {
            background: var(--rule-light);
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 11px;
            font-family: 'SF Mono', Consolas, monospace;
            color: var(--ink);
        }
        .guide-section { margin-bottom: 10px; }
        .guide-section-title {
            font-weight: 700;
            color: var(--ink);
            font-size: 12px;
            margin-bottom: 3px;
        }
        .guide-section ul { padding-left: 14px; margin: 0; }
        .guide-section li { margin-bottom: 3px; }
        .guide-section li::marker { color: var(--accent); }
        .guide-section:last-child {
            margin-bottom: 0;
        }

        /* Zoom controls in panel */
            /* Barra flotante sobre el lienzo, con el historial y el zoom. Se atenúa
               cuando no se está usando para no competir con el diagrama, siguiendo la
               solución de Telperion. */
            .canvas-controls {
                position: absolute; top: 12px; right: 12px;
                display: flex; align-items: center; gap: 3px;
                background: rgba(255, 255, 255, 0.95);
                border: 1px solid var(--rule-light);
                border-radius: 20px;
                padding: 4px;
                box-shadow: 0 2px 8px rgba(44, 36, 32, 0.08);
                z-index: 200;
                opacity: 0; pointer-events: none;
                transition: opacity 0.3s ease;
            }
            .canvas-controls.visible { opacity: 0.65; pointer-events: auto; }
            .canvas-controls.visible:hover { opacity: 1; }
            .canvas-autosave {
                position: absolute; top: 12px; left: 12px;
                display: flex; align-items: center; gap: 6px;
                background: rgba(255, 255, 255, 0.95);
                border: 1px solid var(--rule-light);
                border-radius: 20px;
                padding: 5px 12px;
                box-shadow: 0 2px 8px rgba(44, 36, 32, 0.08);
                font-size: 11.5px; color: var(--ink-muted);
                z-index: 200;
                opacity: 0; pointer-events: none;
                transition: opacity 0.3s ease;
                white-space: nowrap;
            }
            .canvas-autosave.visible { opacity: 0.65; pointer-events: auto; }
            .canvas-autosave.visible:hover { opacity: 1; }

            .canvas-controls-sep {
                width: 1px; height: 18px; margin: 0 3px;
                background: var(--rule-light);
            }

            .zoom-btn {
                width: 28px; 
                height: 28px;
                border: 1px solid var(--rule-light); 
                background: var(--cream);
                border-radius: 50%; /* Botones completamente redondos */
                font-size: 16px; 
                font-weight: 600;
                color: var(--ink-light);
                cursor: pointer;
                display: flex; 
                align-items: center; 
                justify-content: center;
                transition: all 0.2s ease;
                box-shadow: 0 1px 2px rgba(44, 36, 32, 0.06); /* Elevación sutil */
            }

            .zoom-btn:hover:not(:disabled) { 
                background: #ffffff; 
                color: var(--accent);
                border-color: var(--accent-border);
                transform: scale(1.05); /* Pequeño crecimiento al pasar el cursor */
            }

            .zoom-btn:disabled { 
                opacity: 0.4; 
                cursor: not-allowed; 
                box-shadow: none;
                background: transparent;
                border-color: transparent;
            }

            .zoom-indicator {
                min-width: 46px;
                height: 28px;
                display: flex; 
                align-items: center; 
                justify-content: center;
                font-size: 13px; 
                font-weight: 600; 
                color: var(--ink-muted);
                cursor: pointer; 
                user-select: none;
                transition: color 0.15s;
            }

            .zoom-indicator:hover { 
                color: var(--accent); 
            }


        /* ===========================================
           CANVAS (right side)
           =========================================== */
        .canvas-area {
            background: var(--cream);
            position: relative;
            overflow: auto;
            min-height: 100vh;
        }

        .tree-container {
            padding: 40px;
            position: relative;
            overflow: auto;
            max-width: 100%;
            min-height: calc(100vh - 20px);
        }

        .tree-wrapper {
            display: flex;
            justify-content: flex-start;
            padding: 20px 0;
            position: relative;
            width: fit-content;
            min-width: 100%;
            margin: 0 auto;
        }

        .canvas-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--ink-muted);
        }
        .canvas-placeholder .big {
            font-family: 'DM Serif Display', serif;
            font-size: 1.3rem;
            color: var(--rule);
            margin-bottom: 6px;
        }
        .canvas-placeholder p {
            font-size: 14px;
            font-style: italic;
        }

        .zoom-container { transform-origin: top left; }

        /* ===========================================
           TREE STRUCTURE
           =========================================== */
        .children-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }
        .child-branch {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding-top: calc(var(--row-h) / 2);
        }
        .child-branch::before,
        .child-branch::after {
            content: "";
            position: absolute; top: 0;
            width: 50%; height: calc(var(--row-h) / 2);
            border-top: 1.5px solid var(--ink-muted);
        }
        .child-branch::before { right: 50%; }
        .child-branch::after { left: 50%; }
        .child-branch:first-child::before { border-top: none; }
        .child-branch:last-child::after { border-top: none; }

        .v-line-stem {
            width: 1.5px; height: calc(var(--row-h) / 2);
            background-color: var(--ink-muted);
            position: absolute; top: 0; left: 50%;
            transform: translateX(-50%);
        }

        /* ===========================================
           NODES — CARDS WITH ELEVATION
           =========================================== */
        .node-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin: 0 5px;
            width: fit-content;
        }

        .connector-v {
            width: 1.5px;
            background-color: var(--ink-muted);
            margin: 0 auto;
        }

        .node-box {
            height: var(--row-h);
            width: 94px;
            min-width: 94px;
            padding: 0 calc(8px * var(--mak-text-scale, 1));
            border: 1px solid var(--label-border-filled);
            border-radius: 4px;
            background-color: var(--label-bg-filled);
            font-size: calc(11px * var(--mak-text-scale, 1));
            font-family: 'Source Sans 3', sans-serif;
            font-style: italic;
            color: var(--label-text);
            text-align: center;
            position: relative;
            box-shadow: none;
            transition: box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            overflow: visible;
        }
        .node-box.root-node {
            width: auto;
            min-width: 94px;
            max-width: none;
        }
        .node-text-ellipsis {
            display: block;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .node-box.can-divide {
            border-color: var(--accent-border);
            background-color: var(--accent-soft);
            cursor: pointer;
        }
        .node-box.can-divide:hover {
            box-shadow: none;
        }
        .node-box.terminal-node {
            background-color: #fff;
            color: #6e1b1b;
            font-weight: 600;
        }

        /* ===========================================
           LABELS — MULTI-ROW
           =========================================== */
        .labels-stack {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0px;
            position: relative;
            padding-bottom: 0;
        }

        .label-connector-v {
            width: 1.5px;
            height: var(--row-h);
            background-color: var(--ink-muted);
            margin: 0 auto;
            flex-shrink: 0;
        }

        .label-row {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 2px;
            margin: 0;
        }

        .label-input {
            width: 94px;
            text-align: center;
            border: 1px dashed var(--rule);
            border-radius: 4px;
            height: var(--row-h);
            padding: 0 calc(4px * var(--mak-text-scale, 1));
            font-size: calc(11px * var(--mak-text-scale, 1));
            line-height: var(--row-h);
            background: var(--label-bg);
            color: var(--ink-muted);
            font-family: 'Source Sans 3', sans-serif;
            box-sizing: border-box;
        }
        .label-input.has-value {
            background-color: var(--label-bg-filled);
            border: 1px solid var(--label-border-filled);
            color: var(--label-text);
        }

        .label-display {
            min-width: 94px;
            text-align: center;
            border: 1px dashed var(--rule);
            border-radius: 4px;
            height: var(--row-h);
            padding: 0 calc(4px * var(--mak-text-scale, 1));
            font-size: calc(11px * var(--mak-text-scale, 1));
            background: var(--label-bg);
            color: var(--ink-muted);
            font-family: 'Source Sans 3', sans-serif;
            cursor: text;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .label-display.has-value {
            background-color: var(--label-bg-filled);
            border: 1px solid var(--label-border-filled);
            color: var(--label-text);
        }
        .label-display:hover { border-color: var(--accent-border); }

        .label-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }

        .label-add-btn {
            position: absolute;
            bottom: -16px; left: 50%;
            transform: translateX(-50%);
            width: 18px; height: 14px;
            border-radius: 3px;
            border: 1px solid var(--rule);
            background: var(--parchment-deep);
            color: var(--accent);
            font-size: 12px; font-weight: bold;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: all 0.15s;
            padding: 0; z-index: 5;
        }
        .labels-stack:hover .label-add-btn { opacity: 1; pointer-events: auto; }
        .label-add-btn:hover {
            background: var(--accent-soft);
            border-color: var(--accent-border);
        }

        .label-remove-btn {
            position: absolute;
            right: -16px; top: 50%;
            transform: translateY(-50%);
            width: 14px; height: 14px;
            border-radius: 50%;
            border: 1px solid #dcc;
            background: #fff; color: #b44;
            font-size: 9px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.15s;
            padding: 0; line-height: 1; z-index: 5;
        }
        .label-row:hover .label-remove-btn { opacity: 1; pointer-events: auto; }
        .label-remove-btn:hover { background: #fef2f2; border-color: #c44; }

        /* ===========================================
           PUENTES INVISIBLES PARA HOVER DE ETIQUETAS
           =========================================== */
        .labels-stack:hover::after {
            content: '';
            position: absolute;
            bottom: -20px; /* Cubre el espacio vacío hacia el botón + */
            left: 0;
            right: 0;
            height: 20px;
            z-index: 4;
        }

        .label-row:hover::after {
            content: '';
            position: absolute;
            top: -10px;
            bottom: -10px;
            right: -20px; /* Cubre el espacio vacío hacia el botón x */
            width: 20px;
            z-index: 4;
        }

        /* ===========================================
           NODE ACTION BUTTONS
           =========================================== */
        .clear-text-btn {
            position: absolute; top: -10px; right: -10px;
            background: #c44; color: white; border: none; border-radius: 50%;
            width: 18px; height: 18px; font-size: 10px;
            cursor: pointer; display: none;
            align-items: center; justify-content: center;
        }
        .node-box:hover .clear-text-btn { display: flex; }

        .add-node-btn {
            position: absolute; 
            bottom: -10px; 
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent); 
            color: white; 
            border: none; 
    
    /* Cambiamos de círculo a forma de píldora */
            border-radius: 10px; 
            width: 28px; /* Más ancho para que quepa el "+1" cómodamente */
            height: 18px; 
            font-size: 12px;
            font-weight: 600; /* Un poco más de peso para que el "+" resalte */
    
            cursor: pointer; 
            display: none;
            align-items: center; 
            justify-content: center;
        }
        .node-box:hover .add-node-btn { display: flex; }

        .consolidate-btn {
            position: absolute; top: -10px; left: -10px;
            background: #C4963C; color: white; border: none; border-radius: 50%;
            width: 18px; height: 18px; font-size: 10px;
            cursor: pointer; display: none;
            align-items: center; justify-content: center;
        }
        .node-box:hover .consolidate-btn { display: flex; }

        /* ===========================================
           EDIT NODE TEXT
           =========================================== */
        .edit-text-btn {
            position: absolute; bottom: -10px; right: -10px;
            background: #4A8B71; color: white; border: none; border-radius: 50%;
            width: 18px; height: 18px; font-size: 10px;
            cursor: pointer; display: none;
            align-items: center; justify-content: center;
            z-index: 10;
        }
        .node-box:hover .edit-text-btn { display: flex; }

        /* Papelera de rama: vive al inicio de la pila de etiquetas, que es donde el
           usuario percibe que empieza la rama, y no dentro de una fila de etiqueta. */
        .branch-delete-btn {
            position: absolute; top: -8px; left: -8px;
            background: white; color: #c44; border: 1px solid var(--rule-light);
            border-radius: 50%; width: 18px; height: 18px;
            font-size: 9px; line-height: 1; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            padding: 0;
            transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
            z-index: 20;
        }
        .branch-delete-btn:hover { background: #c44; color: white; border-color: #c44; }
        /* El SVG usa currentColor, así que se invierte junto con el botón al pasar
           el cursor, igual que el resto de los íconos de trazo de la interfaz. */
        .branch-delete-btn svg { display: block; }

        /* Vista previa de lo que se va a borrar: se atenúa la rama completa y se
           encierra en un contorno rojo. La opacidad se hereda a los descendientes. */
        .branch-doomed {
            opacity: 0.32;
            outline: 2px dashed #c44;
            outline-offset: 5px;
            border-radius: 4px;
        }

        /* Selector de idioma para la separación automática de palabras */
        .lang-picker { margin-bottom: 14px; }
        .lang-picker-label {
            display: block; font-size: 11px; font-weight: 600;
            letter-spacing: 0.04em; text-transform: uppercase;
            color: var(--ink-muted); margin-bottom: 5px;
        }
        .lang-picker-row { display: flex; gap: 4px; }
        .lang-picker-btn {
            flex: 1; padding: 5px 8px;
            border: 1px solid var(--rule-light); border-radius: 4px;
            background: white; cursor: pointer;
            font-family: 'Source Sans 3', sans-serif; font-size: 12px; color: var(--ink);
            transition: all 0.15s ease;
        }
        .lang-picker-btn:hover { border-color: var(--accent); }
        .lang-picker-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        .lang-picker-hint {
            font-size: 10.5px; color: var(--ink-muted); font-style: italic;
            margin-top: 5px; line-height: 1.35; min-height: 14px;
        }

        /* Previsualización de las etiquetas que entran con un archivo */
        .label-import-preview {
            display: flex; flex-wrap: wrap; gap: 4px;
            max-height: 108px; overflow-y: auto;
            padding: 8px; margin-bottom: 4px;
            background: var(--parchment);
            border: 1px solid var(--rule-light); border-radius: 6px;
        }
        .label-import-chip {
            font-size: 11.5px; padding: 2px 7px;
            background: white; border: 1px solid var(--rule-light);
            border-radius: 10px; color: var(--ink);
        }
        .label-import-more { font-size: 11px; color: var(--ink-muted); font-style: italic; align-self: center; }

        /* Diálogo de primera apertura */
        .lang-choice-list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
        .lang-choice {
            display: flex; flex-direction: column; gap: 3px;
            text-align: left; padding: 10px 12px;
            border: 1px solid var(--rule-light); border-radius: 6px;
            background: white; cursor: pointer;
            font-family: 'Source Sans 3', sans-serif; color: var(--ink);
            transition: all 0.15s ease;
        }
        .lang-choice:hover { border-color: var(--accent); background: var(--cream); }
        .lang-choice strong { font-size: 14px; }
        .lang-choice span { font-size: 11.5px; color: var(--ink-muted); line-height: 1.4; }

        .node-box-row {
            position: relative;
            display: inline-flex;
            align-items: center;
        }
        .node-revert-btn {
            position: absolute; left: 100%; top: 50%;
            transform: translate(8px, -50%);
            z-index: 50; pointer-events: auto;
        }

        .btn-danger-soft {
            background-color: var(--parchment); /* Fondo más claro para hacer contraste */
            color: var(--ink-muted); /* Ícono en un tono neutro */
            border: 1px solid var(--rule);
            width: 25px; /* Ancho fijo reducido */
            height: 15px; /* Alto fijo reducido */
            padding: 0; /* Eliminamos el padding para centrar mejor el ícono */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px; /* Tamaño de la flecha ajustado */
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            box-shadow: none;
        }

        .btn-danger-soft:hover {
            background-color: var(--accent-soft); 
            border-color: var(--accent-border);
            color: var(--accent);
        }

        /* ===========================================
           NEW DIAGRAM MODAL
           =========================================== */
        .new-diagram-modal {
            width: min(480px, calc(100vw - 32px));
            background: var(--cream);
            border: 1px solid var(--rule-light);
            border-radius: 10px;
            box-shadow: 0 20px 40px rgba(44,36,32,0.18);
            padding: 22px 22px 18px;
        }
        .new-diagram-title {
            font-weight: 700;
            color: var(--ink);
            margin: 0 0 6px;
            font-family: 'DM Serif Display', serif;
            font-size: 18px;
        }
        .new-diagram-sub {
            margin: 0 0 14px;
            color: var(--ink-light);
            font-size: 13px;
        }
        .new-diagram-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--rule);
            border-radius: 6px;
            font-size: 15px;
            font-family: 'Source Sans 3', sans-serif;
            background: #fff;
            color: var(--ink);
            outline: none;
            margin-bottom: 14px;
        }
        .new-diagram-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(139,58,58,0.1);
        }
        .new-diagram-input::placeholder {
            color: var(--ink-muted);
            font-style: italic;
        }
        .new-diagram-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        /* Estilos para el panel IPA en New Diagram */
        .ipa-toggle-btn {
            padding: 9px 12px; border: 1px solid var(--rule); border-radius: 6px; 
            background: white; cursor: pointer; font-family: 'Source Sans 3', sans-serif; 
            font-size: 13px; font-weight: 600; color: var(--ink-muted); 
            transition: all 0.2s ease; white-space: nowrap; display: flex; 
            align-items: center; gap: 6px;
        }
        .ipa-toggle-btn:hover { background: var(--parchment-deep); border-color: var(--ink-muted); color: var(--ink); }
        .ipa-toggle-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        .ipa-toggle-btn.active:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

        .ipa-panel { 
            background: white; border: 1px solid var(--rule); border-radius: 8px; 
            padding: 10px; margin-bottom: 14px; box-shadow: 0 4px 12px rgba(44,36,32,0.08); 
            max-height: 200px; overflow-y: auto; 
        }
        .ipa-category-title { 
            font-family: 'Source Sans 3', sans-serif; font-size: 10px; font-weight: 600; 
            text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-muted); 
            margin-top: 6px; margin-bottom: 3px; padding-left: 2px; 
        }
        .ipa-category-title:first-child { margin-top: 0; }
        .ipa-grid { display: flex; flex-wrap: wrap; gap: 2px; }
        .ipa-char-btn { 
            width: 27px; height: 27px; border: 1px solid var(--rule-light); border-radius: 4px; 
            background: var(--parchment); cursor: pointer; font-family: 'Source Sans 3', sans-serif; 
            font-size: 14px; color: var(--ink); display: flex; align-items: center; justify-content: center; 
            transition: all 0.15s ease; padding: 0; 
        }
        .ipa-char-btn:hover { background: var(--accent); color: white; border-color: var(--accent); transform: scale(1.12); }
        .ipa-char-btn:active { transform: scale(0.95); }

        /* ===========================================
           LABEL FORMATTING CONTROLS (SIDE PANEL)
           =========================================== */
        .fmt-controls { display: flex; flex-direction: column; gap: 6px; }
        .fmt-btn-row { display: flex; gap: 3px; }
        /* Los seis botones se reparten el ancho completo de la barra, para que la fila
           quede alineada con el botón de símbolos que va debajo. min-width: 0 evita que
           el contenido impida encogerlos en paneles estrechos. */
        .fmt-btn-row > .fmt-btn { flex: 1 1 0; min-width: 0; padding: 0 2px; }
        .fmt-btn {
            min-width: 26px; height: 26px; padding: 0 5px;
            border: 1px solid var(--rule-light); border-radius: 4px;
            background: white; cursor: pointer;
            font-family: 'Source Sans 3', sans-serif; font-size: 12px; color: var(--ink);
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s ease;
        }
        .fmt-btn:hover:not(:disabled) { background: var(--accent); color: white; border-color: var(--accent); }
        .fmt-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .fmt-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        .fmt-sym-toggle {
            width: 100%; height: 26px; gap: 6px;
            font-size: 11px; font-weight: 600; letter-spacing: 0.03em;
        }
        .fmt-hint {
            font-size: 10px; color: var(--ink-muted); font-style: italic;
            line-height: 1.35; padding: 0 2px;
        }
        .fmt-sym-panel {
            background: white; border: 1px solid var(--rule); border-radius: 6px;
            padding: 7px; max-height: 240px; overflow-y: auto;
            box-shadow: inset 0 1px 3px rgba(44,36,32,0.04);
        }
        .fmt-sym-panel .ipa-char-btn { width: 24px; height: 24px; font-size: 13px; }
        .fmt-sym-panel .ipa-char-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .fmt-sym-panel .ipa-char-btn:disabled:hover {
            background: var(--parchment); color: var(--ink);
            border-color: var(--rule-light); transform: none;
        }
        .fmt-sym-panel .ipa-category-title { margin-top: 7px; }

        /* ===========================================
           CLITIC SUGGESTION MODAL
           =========================================== */
        .clitic-list { list-style: none; padding: 0; margin: 0 0 14px; }
        .clitic-item {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 10px; border-radius: 6px; margin-bottom: 4px;
            background: var(--parchment); border: 1px solid var(--rule-light);
            font-size: 14px; font-family: 'Source Sans 3', sans-serif;
        }
        .clitic-item:last-child { margin-bottom: 0; }
        .clitic-item input[type="checkbox"] {
            accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer;
        }
        .clitic-original {
            color: var(--ink-muted); text-decoration: line-through; min-width: 70px;
        }
        .clitic-arrow { color: var(--ink-muted); font-size: 13px; }
        .clitic-suggestion { color: var(--accent); font-weight: 600; }

        .contraction-original {
            font-weight: 600; color: var(--ink); font-size: 14px;
            min-width: 80px; flex-shrink: 0;
        }
        .contraction-select {
            flex: 1; padding: 7px 10px; border: 1px solid var(--rule);
            border-radius: 6px; font-size: 14px; color: var(--ink);
            background: #fff; min-width: 140px;
            font-family: 'Source Sans 3', sans-serif;
        }
        .contraction-select:focus {
            outline: none; border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(139,58,58,0.1);
        }

        /* ===========================================
           MODALS
           =========================================== */
        .pos-overlay {
            position: fixed; inset: 0;
            background: rgba(44,36,32,0.35);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999;
        }
        .pos-modal {
            width: min(520px, calc(100vw - 32px));
            background: var(--cream);
            border: 1px solid var(--rule-light);
            border-radius: 10px;
            box-shadow: 0 20px 40px rgba(44,36,32,0.18);
            padding: 18px 18px 14px;
        }
        .pos-title { font-weight: 700; color: var(--ink); margin: 0 0 6px; font-family: 'DM Serif Display', serif; }
        .pos-sub { margin: 0 0 12px; color: var(--ink-light); font-size: 13px; }
        .pos-row { display: flex; gap: 10px; align-items: center; }
        .pos-select { flex: 1; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 6px; font-size: 14px; background: #fff; color: var(--ink); font-family: 'Source Sans 3', sans-serif; }
        .pos-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }

        .btn { padding: 9px 20px; border: 1px solid transparent; border-radius: 6px; font-size: 14px; font-weight: 600; font-family: 'Source Sans 3', sans-serif; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; line-height: 1; user-select: none; }
        .btn:active { transform: translateY(1px); }
        .btn-primary { background-color: var(--accent); color: #fff; }
        .btn-primary:hover { background-color: var(--accent-hover); }
        .btn-outline { background-color: var(--cream); border-color: var(--rule); color: var(--ink); }
        .btn-outline:hover { background-color: var(--parchment-deep); border-color: var(--ink-muted); }

        /* ===========================================
        FOOTER ACTUALIZADO (inside panel)
        =========================================== */
        .footer { 
            text-align: center; 
            color: var(--ink-muted); 
            font-size: 10.5px; 
            padding: 15px 0 0; 
            border-top: 1px solid var(--rule);
        }

        .footer-logos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .footer-logo-brand {
            height: 15px; /* Ligeramente más pequeño para el panel lateral */
            width: auto;
            opacity: 0.6; /* Más integrado con la estética de "tinta" */
            transition: opacity 0.2s;
            cursor: pointer;
        }

        .footer-logo-brand:hover {
            opacity: 1;
        }

        .cc-logo { 
            height: 24px; /* Reducido para que coincida con tu logo */
            opacity: 0.6; 
            transition: opacity 0.2s; 
            display: block; 
        }

        .cc-logo:hover { 
            opacity: 1; 
        }

        .footer a { color: var(--ink-light); text-decoration: none; }
        .footer a:hover { text-decoration: underline; }

        /* ===========================================
           RESPONSIVE
           =========================================== */
        /* ===========================================
           LABEL DROPDOWN PILLS
           =========================================== */
        .label-dropdown {
            position: fixed;
            background: white;
            border: 1px solid var(--rule);
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(44,36,32,0.14);
            padding: 10px;
            z-index: 99999;
            width: 220px;
            max-height: 220px;
            overflow-y: auto;
        }
        .label-dropdown-clear {
            display: block;
            font-size: 11px;
            color: var(--ink-muted);
            font-style: italic;
            text-align: center;
            cursor: pointer;
            padding-bottom: 8px;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--rule-light);
            transition: color 0.15s;
        }
        .label-dropdown-clear:hover { color: var(--accent); }
        .label-dropdown-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
        }
        .label-dropdown-group {
            font-size: 9.5px; font-weight: 700; letter-spacing: 0.06em;
            text-transform: uppercase; color: var(--ink-muted);
            padding: 6px 2px 3px; margin-top: 2px;
            border-top: 1px solid var(--rule-light);
        }
        .label-dropdown-group:first-of-type { border-top: none; margin-top: 0; }

        .label-pill {
            padding: 3px 10px;
            font-size: 12px;
            border-radius: 5px;
            cursor: pointer;
            background: var(--parchment-deep);
            border: 1px solid var(--rule);
            font-weight: 600;
            color: var(--label-text);
            transition: all 0.15s;
            white-space: nowrap;
            font-family: 'Source Sans 3', sans-serif;
        }
        .label-pill:hover { background: var(--accent); color: white; border-color: var(--accent); }

        /* ===========================================
           LABELS MODAL
           =========================================== */
        .labels-modal-overlay {
            position: fixed; inset: 0;
            background: rgba(44,36,32,0.35);
            z-index: 10000;
            display: flex; align-items: center; justify-content: center;
        }
        .labels-modal {
            background: var(--cream);
            border: 1px solid var(--rule-light);
            border-radius: 10px;
            box-shadow: 0 20px 40px rgba(44,36,32,0.18);
            padding: 22px 22px 18px;
            width: min(460px, calc(100vw - 32px));
            display: flex; flex-direction: column; gap: 12px;
        }
        .labels-modal-title {
            font-family: 'DM Serif Display', serif;
            font-size: 18px; font-weight: 700;
            color: var(--ink); margin: 0;
        }
        .labels-modal-sub {
            font-size: 13px; color: var(--ink-light); margin: 0;
        }
        .labels-modal-textarea {
            width: 100%; height: 130px;
            padding: 10px 12px;
            border: 1px solid var(--rule);
            border-radius: 6px;
            font-size: 13px;
            font-family: 'Source Sans 3', sans-serif;
            background: white; color: var(--ink);
            outline: none; resize: vertical;
            transition: border-color 0.2s;
        }
        .labels-modal-textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(139,58,58,0.1);
        }
        .labels-modal-preview {
            display: flex; flex-wrap: wrap; gap: 5px;
            min-height: 28px; padding: 6px;
            background: var(--parchment);
            border: 1px solid var(--rule-light);
            border-radius: 6px;
        }
        .labels-modal-preview-empty {
            font-size: 12px; color: var(--ink-muted);
            font-style: italic; align-self: center;
        }
        .labels-modal-actions {
            display: flex; justify-content: space-between; align-items: center; gap: 10px;
        }
        .labels-modal-file-btn {
            padding: 7px 12px;
            border: 1px solid var(--rule);
            border-radius: 6px;
            background: var(--parchment-deep);
            font-size: 13px; font-family: 'Source Sans 3', sans-serif;
            font-weight: 600; color: var(--ink-light);
            cursor: pointer; display: flex; align-items: center; gap: 6px;
            transition: all 0.15s;
        }
        .labels-modal-file-btn:hover {
            border-color: var(--accent-border); color: var(--accent);
            background: var(--accent-soft);
        }
        .labels-modal-count {
            font-size: 12px; color: var(--ink-muted);
        }

        @media (max-width: 600px) {
            .app-layout {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
            }
            .side-panel {
                border-right: none;
                border-bottom: 1px solid var(--rule);
                padding: 12px;
                gap: 10px;
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
            }
            .panel-logo { padding-bottom: 0; border-bottom: none; }
            .canvas-area { min-height: 500px; }
            .panel-spacer { display: none; }
            .panel-guide-toggle { display: none; }
            .panel-guide-content { display: none; }
        }

        /* =================================
           FILENAME MODAL & RESTORE MODAL
           =================================
           Modales adaptados desde Telperion/Kilmer al estilo MAK: paleta
           burdeos sobre fondo pergamino, tipografía DM Serif Display en
           el header (consistente con los títulos del panel lateral) y
           Source Sans 3 en el resto del cuerpo.
        */
        .fnm-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(44, 36, 32, 0.45);
            backdrop-filter: blur(2px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fnmFadeIn 0.15s ease-out;
        }
        @keyframes fnmFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .fnm-card {
            background: linear-gradient(135deg, var(--cream) 0%, var(--parchment) 100%);
            border: 1px solid var(--rule);
            border-radius: 14px;
            box-shadow: 0 16px 48px rgba(44, 36, 32, 0.22);
            width: min(420px, calc(100vw - 40px));
            overflow: hidden;
            animation: fnmCardIn 0.18s cubic-bezier(0.34, 1.3, 0.64, 1);
        }
        @keyframes fnmCardIn {
            from { opacity: 0; transform: translateY(-8px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .fnm-header {
            background: var(--accent);
            color: var(--cream);
            padding: 14px 22px;
            font-family: 'DM Serif Display', serif;
            font-size: 1.15rem;
            font-weight: 400;
            letter-spacing: 0.01em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .fnm-header svg { flex-shrink: 0; opacity: 0.95; }
        .fnm-body { padding: 22px; }
        .fnm-label {
            display: block;
            font-family: 'Source Sans 3', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-light);
            margin-bottom: 8px;
            letter-spacing: 0.02em;
        }
        .fnm-input-wrap {
            display: flex;
            align-items: stretch;
            border: 2px solid var(--rule);
            border-radius: 8px;
            background: var(--cream);
            overflow: hidden;
            transition: border-color 0.15s;
        }
        .fnm-input-wrap:focus-within { border-color: var(--accent); }
        .fnm-input {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            padding: 10px 12px;
            font-family: 'Source Sans 3', sans-serif;
            font-size: 15px;
            color: var(--ink);
            background: transparent;
        }
        .fnm-ext {
            display: flex;
            align-items: center;
            padding: 0 12px;
            background: var(--accent-soft);
            border-left: 1px solid var(--rule);
            font-family: 'SF Mono', Consolas, monospace;
            font-size: 13px;
            color: var(--accent);
            user-select: none;
        }
        .fnm-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding: 0 22px 18px;
        }
        .fnm-btn {
            padding: 9px 18px;
            border-radius: 8px;
            border: 1px solid transparent;
            font-family: 'Source Sans 3', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, transform 0.05s;
        }
        .fnm-btn:active { transform: translateY(1px); }
        .fnm-btn-cancel {
            background: transparent;
            border-color: var(--rule);
            color: var(--ink);
        }
        .fnm-btn-cancel:hover {
            background: var(--parchment-deep);
            border-color: var(--accent-border);
        }
        .fnm-btn-confirm {
            background: var(--accent);
            color: var(--cream);
        }
        .fnm-btn-confirm:hover:not(:disabled) { background: var(--accent-hover); }
        .fnm-btn-confirm:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        /* Radio groups para campos extra del FilenameModal (e.g. fondo del PNG).
           Diseño discreto para no competir con el input del nombre. */
        .fnm-radio-group {
            display: flex;
            gap: 6px;
        }
        .fnm-radio {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 6px 10px;
            border: 1px solid var(--rule-light);
            border-radius: 6px;
            background: transparent;
            cursor: pointer;
            font-family: 'Source Sans 3', sans-serif;
            font-size: 12px;
            color: var(--ink-muted);
            transition: border-color 0.15s, color 0.15s;
        }
        .fnm-radio:hover {
            border-color: var(--rule);
            color: var(--ink);
        }
        .fnm-radio.selected {
            border-color: var(--accent);
            color: var(--ink);
        }
        .fnm-radio input[type="radio"] {
            accent-color: var(--accent);
            margin: 0;
            transform: scale(0.9);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useCallback, useMemo } = React;

        const debounce = (func, delay) => {
            let timeout;
            return (...args) => { clearTimeout(timeout); timeout = setTimeout(() => func(...args), delay); };
        };

        const IPA_CATEGORIES = [
            { title: 'Vowels', chars: 'i y ɨ ʉ ɯ u ɪ ʏ ʊ e ø ɘ ɵ ɤ o ə ɛ œ ɜ ɞ ʌ ɔ æ ɐ a ɶ ɑ ɒ'.split(' ') },
            { title: 'Plosives', chars: 'p b t d ʈ ɖ c ɟ k ɡ q ɢ ʔ'.split(' ') },
            { title: 'Nasals', chars: 'm ɱ n ɳ ɲ ŋ ɴ'.split(' ') },
            { title: 'Fricatives', chars: 'ɸ β f v θ ð s z ʃ ʒ ʂ ʐ ɕ ʑ ç ʝ x ɣ χ ʁ ħ ʕ ʜ ʢ h ɦ'.split(' ') },
            { title: 'Lateral Fricatives', chars: 'ɬ ɮ'.split(' ') },
            { title: 'Approximants', chars: 'ʋ ɹ ɻ j ɰ'.split(' ') },
            { title: 'Lateral Approximants', chars: 'l ɭ ʎ ʟ'.split(' ') },
            { title: 'Trills & Taps', chars: 'ʙ r ʀ ⱱ ɾ ɽ ɺ'.split(' ') },
            { title: 'Affricates', chars: 't͡s d͡z t͡ʃ d͡ʒ t͡ɕ d͡ʑ ʈ͡ʂ ɖ͡ʐ'.split(' ') },
            { title: 'Clicks', chars: 'ʘ ǀ ǃ ǂ ǁ'.split(' ') },
            { title: 'Implosives & Ejectives', chars: 'ɓ ɗ ʄ ɠ ʛ ʼ'.split(' ') },
            { title: 'Co-articulated', chars: 'ʍ w ɥ ɧ'.split(' ') },
            { title: 'Suprasegmentals', chars: 'ˈ ˌ ː ˑ ˘ ‿ | ‖ . ̆'.split(' ') },
            { title: 'Diacritics – Voicing & Airstream', chars: '̥ ̬ ̤ ̰ ̼ ̚'.split(' ') },
            { title: 'Diacritics – Place', chars: '̪ ̺ ̻ ̟ ̠ ̘ ̙'.split(' ') },
            { title: 'Diacritics – Manner', chars: '̝ ̞ ̹ ̜ ̈ ̽ ̩ ̯ ˞ ̃ ̴'.split(' ') },
            { title: 'Diacritics – Secondary', chars: 'ʰ ʷ ʲ ˠ ˤ ⁿ ˡ ˀ'.split(' ') },
            { title: 'Tones – Level (Chao)', chars: '˥ ˦ ˧ ˨ ˩'.split(' ') },
            { title: 'Tones – Diacritics', chars: '̋ ́ ̄ ̀ ̏'.split(' ') },
            { title: 'Tones – Contour', chars: '̌ ̂ ᷄ ᷅ ᷈ ↗ ↘'.split(' ') },
            { title: 'Brackets & Delimiters', chars: '/ [ ] ⟨ ⟩ { }'.split(' ') },
        ];

        // Símbolos habituales en el análisis sistémico-funcional, disponibles al editar
        // etiquetas. Para añadir, quitar o reordenar, basta con editar este array: la
        // interfaz se construye a partir de él, igual que el panel de AFI.
        const SFL_SYMBOLS = [
            { title: 'Hypotaxis', chars: 'α β γ δ ε ζ η θ'.split(' ') },
            { title: 'Expansion & Projection', chars: ['=', '+', '×', '"', "'"] },
            { title: 'Structure & Boundaries', chars: ['^', '//', '/', '‖', '|', '⁀', '≡'] },
            { title: 'Embedding & Enclosure', chars: ['[', ']', '[[', ']]', '«', '»', '⟨', '⟩', '⟪', '⟫'] },
            { title: 'Greek – Lowercase', chars: 'α β γ δ ε ζ η θ ι κ λ μ ν ξ ο π ρ σ ς τ υ φ χ ψ ω'.split(' ') },
            { title: 'Greek – Uppercase', chars: 'Γ Δ Θ Λ Ξ Π Σ Φ Ψ Ω'.split(' ') },
            { title: 'Arrows & Other', chars: '→ ⇒ ↔ ↗ ↘ ↑ ↓ Ø ∅ ≠ ≈'.split(' ') },
        ];

        const computeTextScale = (zoomLevel) => {
            const z = zoomLevel / 100;
            if (z >= 1) return 1;
            return Math.pow(z, 0.24);
        };

        // ════════════════════════════════════════════════════════════════
        // FilenameModal — diálogo personalizado que reemplaza al prompt()
        // nativo del navegador para guardar el .mak y exportar el PNG.
        // Adaptado al estilo MAK: paleta burdeos sobre pergamino, header
        // en DM Serif Display. Se invoca vía askForFilename(...) que
        // devuelve una promesa con el nombre confirmado (string) o, si
        // hay extraFields, un objeto { name, extras }. null si se cancela.
        // ════════════════════════════════════════════════════════════════
        const FilenameModal = ({ title, defaultName, extension, icon, extraFields, onCancel, onConfirm }) => {
            const [value, setValue] = React.useState(defaultName || '');
            const inputRef = React.useRef(null);

            // Estado de los campos extra (radio groups u otros). Las claves son
            // los id de cada campo y el valor inicial es el `default` declarado.
            const [extras, setExtras] = React.useState(() => {
                const init = {};
                (extraFields || []).forEach(f => { init[f.id] = f.default; });
                return init;
            });

            // Auto-focus + selección completa al abrir, para que el usuario pueda
            // sobrescribir el nombre por defecto inmediatamente con su tipeo.
            React.useEffect(() => {
                if (inputRef.current) {
                    inputRef.current.focus();
                    inputRef.current.select();
                }
            }, []);

            // Resultado que devolvemos al confirmar: si hay campos extra
            // devolvemos { name, extras }, si no, sólo el name (para mantener
            // compatibilidad con los call sites que no usan extras).
            const buildResult = React.useCallback(() => {
                const name = value.trim();
                if (extraFields && extraFields.length > 0) return { name, extras };
                return name;
            }, [value, extras, extraFields]);

            // Atajos de teclado a nivel global del modal: Enter confirma, Escape cancela.
            React.useEffect(() => {
                const onKey = (e) => {
                    if (e.key === 'Escape') { e.preventDefault(); onCancel(); }
                    else if (e.key === 'Enter') { e.preventDefault(); if (value.trim()) onConfirm(buildResult()); }
                };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [value, onCancel, onConfirm, buildResult]);

            // Iconos SVG inline para el header (sin dependencias).
            const iconSvg = icon === 'image'
                ? <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                : <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>;

            // Cierre por clic en backdrop. Click sobre la card no propaga.
            return (
                <div className="fnm-backdrop" onMouseDown={onCancel}>
                    <div className="fnm-card" onMouseDown={(e) => e.stopPropagation()}>
                        <div className="fnm-header">
                            {iconSvg}
                            <span>{title}</span>
                        </div>
                        <div className="fnm-body">
                            <label className="fnm-label" htmlFor="fnm-input">File name</label>
                            <div className="fnm-input-wrap">
                                <input
                                    ref={inputRef}
                                    id="fnm-input"
                                    type="text"
                                    className="fnm-input"
                                    value={value}
                                    onChange={(e) => setValue(e.target.value)}
                                    spellCheck={false}
                                    autoComplete="off"
                                />
                                {extension && <div className="fnm-ext">.{extension}</div>}
                            </div>

                            {/* Campos extra opcionales declarados por el caller. */}
                            {extraFields && extraFields.map(field => (
                                <div key={field.id} className="fnm-extra-field">
                                    <div className="fnm-label" style={{ marginTop: '12px', fontSize: '11px' }}>{field.label}</div>
                                    <div className="fnm-radio-group">
                                        {field.options.map(opt => (
                                            <label key={opt.value} className={`fnm-radio ${extras[field.id] === opt.value ? 'selected' : ''}`}>
                                                <input
                                                    type="radio"
                                                    name={field.id}
                                                    value={opt.value}
                                                    checked={extras[field.id] === opt.value}
                                                    onChange={() => setExtras(prev => ({ ...prev, [field.id]: opt.value }))}
                                                />
                                                <span>{opt.label}</span>
                                            </label>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                        <div className="fnm-actions">
                            <button type="button" className="fnm-btn fnm-btn-cancel" onClick={onCancel}>Cancel</button>
                            <button
                                type="button"
                                className="fnm-btn fnm-btn-confirm"
                                disabled={!value.trim()}
                                onClick={() => onConfirm(buildResult())}
                            >Save</button>
                        </div>
                    </div>
                </div>
            );
        };

        // ════════════════════════════════════════════════════════════════
        // RestoreModal — diálogo personalizado que reemplaza al confirm()
        // nativo del navegador al detectar trabajo no guardado en
        // localStorage. Reutiliza las clases .fnm-* del FilenameModal.
        // ════════════════════════════════════════════════════════════════
        const RestoreModal = ({ minutesAgo, onContinue, onDiscard }) => {
            const continueRef = React.useRef(null);

            React.useEffect(() => {
                if (continueRef.current) continueRef.current.focus();
            }, []);

            React.useEffect(() => {
                const onKey = (e) => {
                    if (e.key === 'Escape') { e.preventDefault(); onDiscard(); }
                    else if (e.key === 'Enter') { e.preventDefault(); onContinue(); }
                };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [onContinue, onDiscard]);

            const iconSvg = (
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path>
                    <path d="M3 3v5h5"></path>
                </svg>
            );

            const timeLabel = (minutesAgo === null || minutesAgo < 1)
                ? 'Found unsaved work from your last session.'
                : `Found unsaved work from ${minutesAgo} minute${minutesAgo === 1 ? '' : 's'} ago.`;

            // No cerramos por clic en backdrop: la decisión debe ser explícita.
            return (
                <div className="fnm-backdrop">
                    <div className="fnm-card" onMouseDown={(e) => e.stopPropagation()}>
                        <div className="fnm-header">
                            {iconSvg}
                            <span>Restore previous session</span>
                        </div>
                        <div className="fnm-body">
                            <p style={{
                                fontFamily: "'Source Sans 3', sans-serif",
                                fontSize: '14px',
                                color: 'var(--ink)',
                                margin: '0 0 6px 0',
                                lineHeight: 1.5
                            }}>{timeLabel}</p>
                            <p style={{
                                fontFamily: "'Source Sans 3', sans-serif",
                                fontSize: '13px',
                                color: 'var(--ink-light)',
                                margin: 0,
                                lineHeight: 1.5
                            }}>Continue where you left off, or discard the backup and start fresh?</p>
                        </div>
                        <div className="fnm-actions">
                            <button type="button" className="fnm-btn fnm-btn-cancel" onClick={onDiscard}>Discard</button>
                            <button ref={continueRef} type="button" className="fnm-btn fnm-btn-confirm" onClick={onContinue}>Continue</button>
                        </div>
                    </div>
                </div>
            );
        };

        const SyntaxTreeBuilder = () => {
            // ===========================================
            // ESTADO
            // ===========================================
            const [sentence, setSentence] = useState('');
            const [tree, setTree] = useState(null);
            const [divisionMode, setDivisionMode] = useState(null);
            const [selectedCuts, setSelectedCuts] = useState([]);
            const [posPicker, setPosPicker] = useState(null);
            const [cliticPending, setCliticPending] = useState(null);
            const [contractionPending, setContractionPending] = useState(null);
            const [deletePending, setDeletePending] = useState(null);
            const [hoverDeleteId, setHoverDeleteId] = useState(null);
            // Nodo bajo el cursor. Se usa onMouseOver con stopPropagation porque el evento
            // burbujea: el nodo más interno lo atiende primero y detiene la propagación, de
            // modo que solo aparece una papelera a la vez y no una por cada antepasado.
            const [hoverNodeId, setHoverNodeId] = useState(null);

            // Idioma para la separación automática de palabras: 'es', 'en' o 'none'.
            // No hay valor por defecto. Mientras sea null, el programa pide al usuario
            // que elija antes de dejarlo trabajar. La elección se recuerda entre sesiones
            // y puede cambiarse en cualquier momento desde el panel izquierdo.
            const [analysisLang, setAnalysisLang] = useState(() => {
                try {
                    const saved = localStorage.getItem('mak-lang');
                    return (saved === 'es' || saved === 'en' || saved === 'none') ? saved : null;
                } catch { return null; }
            });
            useEffect(() => {
                if (!analysisLang) return;
                try { localStorage.setItem('mak-lang', analysisLang); } catch {}
            }, [analysisLang]);
            const [nodeTextPending, setNodeTextPending] = useState(null);
            const [nodeTextValue, setNodeTextValue] = useState('');

            // Historial Undo/Redo
            const [history, setHistory] = useState([]);
            const [historyIndex, setHistoryIndex] = useState(-1);
            const isUndoRedo = useRef(false);

            // Referencias
            const fileInputRef = useRef(null);
            const treeContainerRef = useRef(null);
            const zoomContainerRef = useRef(null);

            // Zoom
            const [zoomLevel, setZoomLevel] = useState(100);
            const ZOOM_MIN = 60;
            const ZOOM_MAX = 200;
            const ZOOM_STEP = 20;

            // Auto-guardado
            const [isSaving, setIsSaving] = useState(false);
            const [lastSaved, setLastSaved] = useState(null);
            const formatTimeAgo = (dateObj) => {
                if (!dateObj) return '';
                const diffMs = Date.now() - dateObj.getTime();
                const diffSec = Math.max(0, Math.floor(diffMs / 1000));
                if (diffSec < 10) return 'just now';
                if (diffSec < 60) return 'a few seconds ago';
                const diffMin = Math.floor(diffSec / 60);
                if (diffMin < 60) return `${diffMin} min ago`;
                const diffHr = Math.floor(diffMin / 60);
                return `${diffHr} h ago`;
            };

            // Escala tipográfica
            const textScale = useMemo(() => computeTextScale(zoomLevel), [zoomLevel]);

            const makeZoomHandlers = (setter) => ({
                zoomIn:    () => setter(prev => Math.min(prev + ZOOM_STEP, ZOOM_MAX)),
                zoomOut:   () => setter(prev => Math.max(prev - ZOOM_STEP, ZOOM_MIN)),
                zoomReset: () => setter(100),
            });
            const { zoomIn, zoomOut, zoomReset } = useMemo(() => makeZoomHandlers(setZoomLevel), []);

            // ===========================================
            // MODALES (filename / restauración)
            // ===========================================
            // filenameModal !== null mientras está abierto el diálogo de guardar/exportar.
            // La promesa devuelta por askForFilename se resuelve al confirmar o cancelar.
            const [filenameModal, setFilenameModal] = useState(null);
            const filenameResolverRef = useRef(null);

            const askForFilename = useCallback(({ title, defaultName, extension, icon, extraFields }) => {
                return new Promise((resolve) => {
                    filenameResolverRef.current = resolve;
                    setFilenameModal({
                        title,
                        defaultName: defaultName || '',
                        extension: extension || '',
                        icon: icon || null,
                        extraFields: extraFields || null
                    });
                });
            }, []);

            const closeFilenameModal = useCallback((value) => {
                const resolve = filenameResolverRef.current;
                filenameResolverRef.current = null;
                setFilenameModal(null);
                if (resolve) resolve(value);
            }, []);

            // restorePending !== null mientras está abierto el diálogo de restauración.
            // Guardamos los datos parseados para no parsear dos veces y poder mostrar minutesAgo.
            const [restorePending, setRestorePending] = useState(null);

            // Etiqueta en edición
            const [editingLabel, setEditingLabel] = useState(null);
            const [editingNode, setEditingNode] = useState(null);

            // ===========================================
            // FORMATO Y SÍMBOLOS EN ETIQUETAS
            // ===========================================
            // Los controles viven en el panel lateral y actúan sobre la etiqueta que
            // está en edición. En vez de pasar un ref por props hasta cada etiqueta,
            // guardamos el nodo DOM del input activo y lo recuperamos desde
            // document.activeElement si se perdió (las etiquetas se desmontan al
            // navegar con Tab). Es el patrón que ya usa Kilmer.
            const activeLabelInputRef = useRef(null);
            const [showSymbolPanel, setShowSymbolPanel] = useState(false);

            const getActiveLabelInput = () => {
                let target = activeLabelInputRef.current;
                const stale = !target || target.tagName !== 'INPUT' || !document.contains(target);
                if (stale) {
                    const el = document.activeElement;
                    target = (el && el.tagName === 'INPUT' && el.classList.contains('label-input')) ? el : null;
                    activeLabelInputRef.current = target;
                }
                return target;
            };

            // Escribe en el input con el setter nativo y despacha un evento 'input'.
            // Es necesario porque el input es controlado por React: asignar .value
            // directamente no actualizaría el estado del árbol.
            const writeToLabelInput = (target, nextValue, selStart, selEnd) => {
                const nativeSetter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
                nativeSetter.call(target, nextValue);
                target.dispatchEvent(new Event('input', { bubbles: true }));
                target.focus();
                try { target.setSelectionRange(selStart, selEnd); } catch (_) {}
            };

            const insertSymbolInLabel = (str) => {
                const target = getActiveLabelInput();
                if (!target) return;
                const start = (typeof target.selectionStart === 'number') ? target.selectionStart : target.value.length;
                const end = (typeof target.selectionEnd === 'number') ? target.selectionEnd : target.value.length;
                const next = target.value.slice(0, start) + str + target.value.slice(end);
                const caret = start + str.length;
                writeToLabelInput(target, next, caret, caret);
            };

            // Envuelve la selección con marcadores. Sin selección, deja el cursor
            // entre los marcadores para escribir directamente.
            const wrapLabelSelection = (left, right = left) => {
                const target = getActiveLabelInput();
                if (!target) return;
                const start = (typeof target.selectionStart === 'number') ? target.selectionStart : target.value.length;
                const end = (typeof target.selectionEnd === 'number') ? target.selectionEnd : target.value.length;
                const before = target.value.slice(0, start);
                const sel = target.value.slice(start, end);
                const after = target.value.slice(end);
                const next = before + left + sel + right + after;
                if (sel) {
                    writeToLabelInput(target, next, start + left.length, start + left.length + sel.length);
                } else {
                    const caret = start + left.length;
                    writeToLabelInput(target, next, caret, caret);
                }
            };

            // ===========================================
            // CATÁLOGO DE ETIQUETAS DE USUARIO
            // ===========================================
            // El catálogo se guarda por grupos: [{ title, labels }]. Un título null
            // corresponde a las etiquetas escritas antes del primer encabezado, que es
            // el caso de todos los catálogos planos anteriores.
            const migrateLabelStore = (data) => {
                if (!Array.isArray(data) || data.length === 0) return [];
                if (typeof data[0] === 'string') {
                    return [{ title: null, labels: data.map(l => String(l).trim()).filter(Boolean) }];
                }
                return data
                    .filter(g => g && Array.isArray(g.labels))
                    .map(g => ({
                        title: g.title ? String(g.title).trim() : null,
                        labels: g.labels.map(l => String(l).trim()).filter(Boolean),
                    }))
                    .filter(g => g.labels.length);
            };

            const [labelGroups, setLabelGroups] = useState(() => {
                try {
                    const saved = localStorage.getItem('mak-labels');
                    return saved ? migrateLabelStore(JSON.parse(saved)) : [];
                } catch { return []; }
            });

            // Lista plana, para los usos que no necesitan la estructura (contadores,
            // comparaciones al importar).
            const userLabels = useMemo(
                () => labelGroups.flatMap(g => g.labels),
                [labelGroups]
            );
            const hasLabelGroupTitles = labelGroups.some(g => g.title);
            const [showLabelsModal, setShowLabelsModal] = useState(false);
            const [labelsTextDraft, setLabelsTextDraft] = useState('');
            const labelsFileInputRef = useRef(null);

            const saveLabelsToFile = () => {
                const toSave = showLabelsModal ? parseLabels(labelsTextDraft) : labelGroups;
                if (toSave.every(g => !g.labels.length)) return;
                const content = serializeLabelGroups(toSave);
                const blob = new Blob([content], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'mak-labels.txt';
                a.click();
                URL.revokeObjectURL(url);
            };

            const handleLoadLabelsFromPanel = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const text = ev.target.result.trim();
                    if (!text) return;
                    setLabelsTextDraft(text);
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            // Dropdown de pills
            const [labelImport, setLabelImport] = useState(null); // { incoming, missing, current }
            const labelGroupsRef = useRef(labelGroups);
            useEffect(() => { labelGroupsRef.current = labelGroups; }, [labelGroups]);
